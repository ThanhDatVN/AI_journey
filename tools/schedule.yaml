header: '# 📅 Lịch học theo tuần


  > Lịch **44 tuần** (~10 tháng) với **6–10 giờ mỗi tuần** — kế thừa cách tổ chức theo tuần của khoá [AIVN-Machine-Learning](https://github.com/thanhhff/AIVN-Machine-Learning), mở rộng tới Deep Learning,
  ML đáng tin cậy và MLOps. Mỗi tuần: đọc và chạy bài học → làm bài tập `90_exercises` → **PASS** checkpoint `99_checkpoint` trước khi sang tuần sau. Học nhanh hay chậm hơn đều được — thứ tự mới là điều
  quan trọng. Lộ trình rút gọn theo mục tiêu: xem [ROADMAP.md](ROADMAP.md).


  Ký hiệu: 📖 bài học · 💻 assignment · 📝 bài tập L0–L7 · ✅ checkpoint · 🏋️ luyện tập xen kẽ · 🛠️ project · 🎓 bài thi tổng hợp.


  > File này được sinh tự động từ `tools/schedule.yaml` bởi `python tools/generate_index.py` — sửa YAML, đừng sửa trực tiếp.'
