coding:
  tasks:
    - id: c01
      title: Precision, recall tại một ngưỡng
      prompt: |
        Viết `precision_recall_at(y_true, scores, threshold)` → `(precision, recall)` với dự đoán dương khi score ≥ threshold;
        không có dự đoán dương thì precision = 0.
      code: |
        def precision_recall_at(y_true, scores, threshold):
            ### START CODE HERE ### (≈ 5 dòng)
            y, pred = np.asarray(y_true), np.asarray(scores) >= threshold
            tp = int(np.sum(pred & (y == 1)))
            fp = int(np.sum(pred & (y == 0)))
            fn = int(np.sum(~pred & (y == 1)))
            return (tp / (tp + fp) if tp + fp else 0.0), (tp / (tp + fn) if tp + fn else 0.0)
            ### END CODE HERE ###
      tests: |
        y = np.array([1, 1, 0, 0, 1])
        s = np.array([0.9, 0.4, 0.6, 0.1, 0.8])
        check_close(precision_recall_at(y, s, 0.5), (2 / 3, 2 / 3), message="ngưỡng 0.5")
        check_close(precision_recall_at(y, s, 0.95), (0.0, 0.0), message="không có dự đoán dương")
        check_close(precision_recall_at(y, s, 0.0), (0.6, 1.0), message="mọi dự đoán dương")
    - id: c02
      title: Ngưỡng tối ưu theo chi phí
      prompt: |
        Viết `best_threshold(y_true, proba, cost_fn, cost_fp, grid)`: với mỗi ngưỡng t trong `grid`, chi phí = cost_fn·(số bỏ sót) + cost_fp·(số báo động giả)
        (dương khi proba ≥ t); trả về `(t_tốt_nhất, chi_phí_nhỏ_nhất)` (hoà → ngưỡng nhỏ hơn).
      code: |
        def best_threshold(y_true, proba, cost_fn, cost_fp, grid):
            ### START CODE HERE ### (≈ 6 dòng)
            y, proba = np.asarray(y_true), np.asarray(proba)
            best = (None, np.inf)
            for t in sorted(grid):
                pred = proba >= t
                cost = cost_fn * np.sum(~pred & (y == 1)) + cost_fp * np.sum(pred & (y == 0))
                if cost < best[1]:
                    best = (t, float(cost))
            return best
            ### END CODE HERE ###
      tests: |
        y = np.array([1, 0, 0, 1, 0])
        p = np.array([0.3, 0.2, 0.6, 0.8, 0.1])
        check_close(best_threshold(y, p, cost_fn=10, cost_fp=1, grid=[0.15, 0.25, 0.5, 0.7]), (0.25, 1.0), message="chi phí bỏ sót cao → ngưỡng thấp")
        check_close(best_threshold(y, p, cost_fn=1, cost_fp=10, grid=[0.15, 0.25, 0.5, 0.7]), (0.7, 1.0), message="chi phí báo động giả cao → ngưỡng cao")
analysis:
  prompt: |
    Một nhóm xây mô hình phát hiện máy móc sắp hỏng (0.8% dương) từ 500 cảm biến. Quy trình: (1) chọn 30 cảm biến tương quan mạnh nhất với nhãn trên toàn bộ dữ liệu;
    (2) SMOTE trên toàn bộ dữ liệu cho cân bằng 50/50; (3) chia ngẫu nhiên train/test theo **thời điểm đo** (mỗi máy đo mỗi giờ); (4) grid search 3.000 cấu hình,
    chọn theo accuracy trên test; (5) báo cáo "accuracy 97%". Phân tích và đề xuất quy trình đúng.
  rubric:
    - "Chỉ ra chọn đặc trưng trên toàn bộ dữ liệu trước CV là rò rỉ → chọn trong pipeline bên trong CV"
    - "Chỉ ra SMOTE trước khi chia tạo mẫu tổng hợp từ điểm test → chỉ resample trên train trong pipeline (hoặc dùng class weight)"
    - "Chỉ ra chia ngẫu nhiên theo giờ với dữ liệu chuỗi thời gian từ cùng máy → chia theo thời gian và/hoặc theo máy (GroupKFold)"
    - "Chỉ ra accuracy vô nghĩa với 0.8% dương và chọn cấu hình trên test → dùng PR-AUC/recall/chi phí, validation/nested CV, test một lần"
    - "Đề xuất ngưỡng theo chi phí bỏ sót vs bảo trì không cần thiết, và báo cáo độ bất định"
  sample_answer: |
    (1) Chọn cảm biến bằng tương quan với nhãn trên cả dữ liệu test làm điểm đánh giá lạc quan (nhất là với 500 đặc trưng — nhiều tương quan giả); phải
    chọn trong pipeline, fit trong từng fold. (2) SMOTE trước khi chia tạo điểm tổng hợp nội suy từ điểm sẽ nằm trong test → rò rỉ; chỉ resample phần train
    trong pipeline của imblearn, hoặc dùng class_weight. (3) Các giờ liền kề của cùng máy gần như giống nhau; chia ngẫu nhiên làm mô hình "nhớ" máy và giai
    đoạn → chia theo thời gian (dự báo tương lai) và theo máy (máy mới chưa thấy). (4) Accuracy với 0.8% dương: luôn đoán "không hỏng" đã 99.2%; dùng
    PR-AUC, recall ở mức báo động giả chấp nhận được, hoặc chi phí kỳ vọng. Chọn trong 3.000 cấu hình trên test → lạc quan; dùng validation theo thời gian /
    nested CV, random search hoặc successive halving thay cho lưới, test một lần. (5) Đặt ngưỡng theo chi phí hỏng máy vs bảo trì sớm; báo cáo khoảng tin cậy
    (bootstrap theo máy) và hiệu năng theo từng loại máy.
project:
  prompt: |
    **Mini project — Gian lận và ngưỡng chi phí.** Với `fraud_transactions.csv` (đặc trưng `log_amount` = log(amount_vnd), cùng các cột trong `NUMERIC`, `CATEGORICAL`):
    chia train/validation/test = 49/21/30 phân tầng (`random_state=0`, như đoạn code cho sẵn); hồi quy logistic; chọn ngưỡng trên **validation** trong lưới
    `GRID` để tối thiểu chi phí (bỏ sót = 50, báo động giả = 1); áp dụng ngưỡng đó trên test. Lưu `val_pr_auc`, `threshold`, `test_cost`, `baseline_cost` (không báo
    động gì). Yêu cầu: PR-AUC validation > 0.06; ngưỡng < 0.5; chi phí test < 80% baseline.
  code: |
    import pandas as pd
    from sklearn.compose import ColumnTransformer
    from sklearn.linear_model import LogisticRegression
    from sklearn.metrics import average_precision_score
    from sklearn.model_selection import train_test_split
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import OneHotEncoder, StandardScaler

    from ml_course.utils import repo_path

    tx = pd.read_csv(repo_path("data", "sample", "fraud_transactions.csv")).assign(log_amount=lambda d: np.log(d.amount_vnd))
    NUMERIC = ["log_amount", "hour", "distance_from_home_km", "n_tx_last_24h", "card_age_days"]
    CATEGORICAL = ["merchant_category", "is_foreign"]
    GRID = [0.005, 0.01, 0.02, 0.03, 0.05, 0.1, 0.2, 0.5]
    rest, test = train_test_split(tx, test_size=0.3, random_state=0, stratify=tx.is_fraud)
    train, valid = train_test_split(rest, test_size=0.3, random_state=0, stratify=rest.is_fraud)
    ### START CODE HERE ### (≈ 12 dòng)
    model = make_pipeline(ColumnTransformer([("num", StandardScaler(), NUMERIC), ("cat", OneHotEncoder(handle_unknown="ignore"), CATEGORICAL)]),
                          LogisticRegression(max_iter=2000)).fit(train, train.is_fraud)
    p_val, p_test = model.predict_proba(valid)[:, 1], model.predict_proba(test)[:, 1]
    val_pr_auc = average_precision_score(valid.is_fraud, p_val)


    def cost(y, proba, t):
        pred = proba >= t
        return 50 * np.sum(~pred & (y == 1)) + 1 * np.sum(pred & (y == 0))


    threshold = min(GRID, key=lambda t: cost(valid.is_fraud.values, p_val, t))
    test_cost = cost(test.is_fraud.values, p_test, threshold)
    baseline_cost = 50 * int(test.is_fraud.sum())
    ### END CODE HERE ###
    print(f"PR-AUC valid {val_pr_auc:.3f} | ngưỡng {threshold} | chi phí test {test_cost} vs không báo động {baseline_cost}")
  tests: |
    check_greater(val_pr_auc, 0.06, "PR-AUC validation")
    check_less(threshold, 0.5, "ngưỡng theo chi phí thấp hơn 0.5")
    check_less(test_cost, 0.8 * baseline_cost, "chi phí test < 80% không báo động")
