coding:
  tasks:
    - id: c01
      title: Một vòng K-Means
      prompt: |
        Viết `kmeans_step(X, centers)` → `(labels, new_centers)`: gán mỗi điểm vào tâm gần nhất (Euclid), rồi cập nhật tâm = trung bình
        các điểm của cụm (cụm rỗng giữ tâm cũ).
      code: |
        def kmeans_step(X, centers):
            ### START CODE HERE ### (≈ 6 dòng)
            X, centers = np.asarray(X, float), np.asarray(centers, float)
            d = ((X[:, None, :] - centers[None, :, :]) ** 2).sum(-1)
            labels = d.argmin(axis=1)
            new = centers.copy()
            for k in range(len(centers)):
                if np.any(labels == k):
                    new[k] = X[labels == k].mean(axis=0)
            return labels, new
            ### END CODE HERE ###
      tests: |
        X = np.array([[0.0, 0], [0, 1], [10, 10], [10, 11]])
        labels, centers = kmeans_step(X, np.array([[0.0, 0], [10, 10]]))
        check_equal(list(labels), [0, 0, 1, 1], "gán cụm")
        check_close(centers, [[0, 0.5], [10, 10.5]], message="cập nhật tâm")
        _, kept = kmeans_step(X, np.array([[0.0, 0], [10, 10], [100, 100]]))
        check_close(kept[2], [100, 100], message="cụm rỗng giữ tâm cũ")
    - id: c02
      title: PCA bằng SVD
      prompt: |
        Viết `pca(X, k)` → `(Z, explained_ratio)`: trừ trung bình theo cột, SVD, chiếu lên k thành phần đầu (Z = X_c · V_k),
        explained_ratio = σᵢ² / Σσ² của k thành phần đầu.
      code: |
        def pca(X, k):
            ### START CODE HERE ### (≈ 4 dòng)
            Xc = np.asarray(X, float) - np.mean(X, axis=0)
            U, s, Vt = np.linalg.svd(Xc, full_matrices=False)
            ratio = s ** 2 / np.sum(s ** 2)
            return Xc @ Vt[:k].T, ratio[:k]
            ### END CODE HERE ###
      tests: |
        from sklearn.decomposition import PCA
        rng = np.random.default_rng(0)
        X = rng.normal(size=(100, 4)) @ rng.normal(size=(4, 4))
        Z, ratio = pca(X, 2)
        ref = PCA(2).fit(X)
        check_close(ratio, ref.explained_variance_ratio_, message="tỉ lệ phương sai giải thích")
        check_close(np.abs(Z), np.abs(ref.transform(X)), tol=1e-6, message="toạ độ chiếu (sai khác dấu cho phép)")
analysis:
  prompt: |
    Một chuỗi bán lẻ phân cụm 50.000 khách hàng bằng K-Means trên 40 đặc trưng (doanh thu tính bằng đồng, số lượt mua, tỉ lệ mua online, ...) không chuẩn
    hoá, chọn k = 12 vì inertia nhỏ nhất trong khoảng 2–12, rồi vẽ t-SNE và kết luận "cụm 3 và cụm 7 nằm xa nhau nên là hai nhóm khách hàng rất khác biệt".
    Phân tích các vấn đề và đề xuất quy trình đúng.
  rubric:
    - "Chỉ ra không chuẩn hoá → doanh thu (thang lớn) chi phối khoảng cách"
    - "Chỉ ra inertia luôn giảm khi k tăng → không dùng inertia nhỏ nhất; dùng silhouette/elbow/BIC/ổn định và tính hữu ích nghiệp vụ"
    - "Chỉ ra khoảng cách giữa các cụm trên t-SNE không có ý nghĩa → so sánh hồ sơ cụm ở không gian gốc"
    - "Đề xuất kiểm tra độ ổn định (nhiều seed, bootstrap), xử lý ngoại lai/đặc trưng lệch (log), cân nhắc GMM/giảm chiều"
    - "Đề xuất đánh giá bằng hành động: phân khúc có dẫn tới chiến lược khác nhau và đo được hiệu quả (A/B)"
  sample_answer: |
    Không chuẩn hoá: doanh thu tính bằng đồng (hàng triệu) lấn át mọi đặc trưng khác — K-Means chỉ chia theo doanh thu; cần log cho đặc trưng lệch và chuẩn
    hoá. Inertia luôn giảm theo k nên "nhỏ nhất ở k = 12" chỉ phản ánh k lớn nhất đã thử; chọn k bằng elbow, silhouette, BIC (GMM), độ ổn định giữa các lần
    chạy, và quan trọng nhất là số phân khúc đội marketing có thể hành động. t-SNE bảo toàn láng giềng cục bộ, không bảo toàn khoảng cách giữa cụm — hai
    cụm xa nhau trên t-SNE chưa chắc khác nhau nhiều; so sánh trung bình/phân phối đặc trưng của từng cụm ở không gian gốc. Quy trình: làm sạch, biến đổi,
    chuẩn hoá, có thể PCA giữ 90% phương sai; thử K-Means và GMM với nhiều k; kiểm tra ổn định (nhiều seed, bootstrap, ARI); đặt tên cụm theo hồ sơ; kiểm
    chứng giá trị bằng thí nghiệm theo phân khúc.
project:
  prompt: |
    **Mini project — Phân khúc khách hàng.** Với `customer_segments.csv` (4 đặc trưng `FEATURES`): chuẩn hoá; chọn k ∈ [2, 8] có silhouette lớn nhất
    với `KMeans(k, n_init=10, random_state=0)` → `best_k`; gán nhãn `labels`; tính `ari` so với cột `true_segment` (chỉ để kiểm chứng). Yêu cầu: best_k = 5,
    ARI > 0.85.
  code: |
    import pandas as pd
    from sklearn.cluster import KMeans
    from sklearn.metrics import adjusted_rand_score, silhouette_score
    from sklearn.preprocessing import StandardScaler

    from ml_course.utils import repo_path

    customers = pd.read_csv(repo_path("data", "sample", "customer_segments.csv"))
    FEATURES = ["annual_income_musd", "spending_score", "age", "visits_per_month"]
    ### START CODE HERE ### (≈ 5 dòng)
    X = StandardScaler().fit_transform(customers[FEATURES])
    scores = {k: silhouette_score(X, KMeans(k, n_init=10, random_state=0).fit_predict(X)) for k in range(2, 9)}
    best_k = max(scores, key=scores.get)
    labels = KMeans(best_k, n_init=10, random_state=0).fit_predict(X)
    ari = adjusted_rand_score(customers.true_segment, labels)
    ### END CODE HERE ###
    print(f"k = {best_k} | ARI = {ari:.3f}")
  tests: |
    check_equal(best_k, 5, "silhouette chọn k = 5")
    check_greater(ari, 0.85, "ARI > 0.85")
    check_equal(len(labels), 600, "mọi khách được gán cụm")
