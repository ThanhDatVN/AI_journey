coding:
  tasks:
    - id: c01
      title: Softmax và cross-entropy ổn định số
      prompt: |
        Viết `softmax(z)` theo hàng (trừ max mỗi hàng trước khi exp) và `cross_entropy(logits, y)` = trung bình −log softmax của lớp đúng,
        tính ổn định bằng log-sum-exp (không lấy log của softmax đã tính).
      code: |
        def softmax(z):
            ### START CODE HERE ### (≈ 2 dòng)
            z = np.asarray(z, float) - np.max(z, axis=1, keepdims=True)
            return np.exp(z) / np.exp(z).sum(axis=1, keepdims=True)
            ### END CODE HERE ###


        def cross_entropy(logits, y):
            ### START CODE HERE ### (≈ 3 dòng)
            z = np.asarray(logits, float)
            m = z.max(axis=1, keepdims=True)
            log_sum = m[:, 0] + np.log(np.exp(z - m).sum(axis=1))
            return float(np.mean(log_sum - z[np.arange(len(z)), np.asarray(y)]))
            ### END CODE HERE ###
      tests: |
        check_close(softmax(np.array([[0.0, np.log(3)]])), [[0.25, 0.75]], message="softmax")
        check_close(softmax(np.array([[1000.0, 1000.0]])), [[0.5, 0.5]], message="ổn định với logit rất lớn")
        check_close(cross_entropy(np.array([[0.0, np.log(3)]]), [0]), np.log(4), message="cross-entropy")
        check_true(np.isfinite(cross_entropy(np.array([[1000.0, -1000.0]]), [1])), "không tràn số")
        check_close(cross_entropy(np.array([[1000.0, -1000.0]]), [1]), 2000.0, message="giá trị đúng khi logit cực đoan")
    - id: c02
      title: Scaled dot-product attention
      prompt: |
        Viết `attention(Q, K, V, mask=None)`: trọng số = softmax(QKᵀ/√d) theo hàng (d = số cột của Q); nếu `mask` (bool, True = được nhìn) được cho,
        đặt điểm các vị trí False thành −∞ trước softmax. Trả về `(output, weights)`.
      code: |
        def attention(Q, K, V, mask=None):
            ### START CODE HERE ### (≈ 6 dòng)
            Q, K, V = (np.asarray(a, float) for a in (Q, K, V))
            scores = Q @ K.T / np.sqrt(Q.shape[1])
            if mask is not None:
                scores = np.where(mask, scores, -np.inf)
            scores = scores - scores.max(axis=1, keepdims=True)
            weights = np.exp(scores) / np.exp(scores).sum(axis=1, keepdims=True)
            return weights @ V, weights
            ### END CODE HERE ###
      tests: |
        rng = np.random.default_rng(0)
        Q, K, V = rng.normal(size=(3, 4)), rng.normal(size=(5, 4)), rng.normal(size=(5, 2))
        out, w = attention(Q, K, V)
        check_close(w.sum(axis=1), np.ones(3), message="trọng số mỗi hàng cộng bằng 1")
        check_close(out, w @ V, message="đầu ra = trọng số × V")
        causal = np.tril(np.ones((4, 4), bool))
        _, wc = attention(rng.normal(size=(4, 4)), rng.normal(size=(4, 4)), rng.normal(size=(4, 4)), causal)
        check_close(np.triu(wc, 1), np.zeros((4, 4)), message="mặt nạ nhân quả: không nhìn tương lai")
        check_close(wc[0], [1, 0, 0, 0], message="token đầu chỉ nhìn chính nó")
analysis:
  prompt: |
    Một sinh viên huấn luyện CNN phân loại 10 lớp ảnh (5.000 ảnh). Nhật ký: loss train giảm từ 2.3 về 0.01, accuracy validation tăng lên 62% ở epoch 8 rồi
    giảm dần còn 51% ở epoch 60; loss validation tăng từ epoch 8. Sinh viên dùng learning rate 0.1 với Adam, không augmentation, không dropout/weight decay,
    và báo cáo "accuracy 99.8%" (accuracy train). Chẩn đoán và đề xuất.
  rubric:
    - "Chẩn đoán overfitting rõ (train loss → 0, val loss tăng từ epoch 8) và báo cáo accuracy train là sai"
    - "Đề xuất early stopping / chọn checkpoint theo validation"
    - "Đề xuất điều chuẩn: augmentation, dropout, weight decay, mô hình nhỏ hơn hoặc transfer learning"
    - "Chỉ ra learning rate 0.1 với Adam quá lớn → 1e-3, có lịch learning rate"
    - "Đề xuất báo cáo trên tập test tách biệt, kèm ma trận nhầm lẫn/phân tích lỗi"
  sample_answer: |
    Overfitting kinh điển: mô hình thuộc lòng 5.000 ảnh (loss train 0.01) trong khi validation tốt nhất ở epoch 8 rồi xấu đi. Báo cáo 99.8% (train) vô
    nghĩa — phải báo cáo trên test tách biệt, dùng checkpoint chọn theo validation. Đề xuất: early stopping; augmentation (lật, cắt, xoay nhẹ, đổi màu —
    hợp lệ với nhãn); dropout/weight decay; hoặc tốt hơn với 5.000 ảnh: transfer learning từ mô hình tiền huấn luyện, đóng băng phần lớn rồi fine-tune.
    Learning rate 0.1 với Adam quá lớn (mặc định 1e-3), kết hợp lịch giảm (cosine/OneCycle). Sau khi sửa, phân tích ma trận nhầm lẫn và các ảnh sai để biết
    lỗi do dữ liệu (nhãn sai, lớp giống nhau) hay do mô hình.
project:
  prompt: |
    **Mini project — Mạng nơ-ron 2 lớp tự viết.** Dữ liệu `make_classification_2d("moons", n=600, noise=0.2, seed=0)`, chia 70/30 phân tầng (`random_state=0`).
    Cài mạng `2 → 16 (tanh) → 1 (sigmoid)` **bằng numpy** (không dùng thư viện deep learning): khởi tạo `W1 ~ N(0, 1)`, `W2 ~ N(0, 1)/√16` (seed 0), bias 0;
    gradient descent toàn batch trên log-loss, learning rate 1.0, 3.000 bước. Lưu `test_acc` và `logreg_acc` (hồi quy logistic trên cùng dữ liệu). Yêu cầu:
    test_acc > 0.95 và cao hơn logistic ít nhất 5 điểm.
  code: |
    from sklearn.linear_model import LogisticRegression
    from sklearn.model_selection import train_test_split

    from ml_course.datasets import make_classification_2d

    X, y = make_classification_2d("moons", n=600, noise=0.2, seed=0)
    X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.3, random_state=0, stratify=y)
    ### START CODE HERE ### (≈ 16 dòng)
    rng = np.random.default_rng(0)
    W1, b1 = rng.normal(0, 1, (2, 16)), np.zeros(16)
    W2, b2 = rng.normal(0, 1, (16, 1)) / np.sqrt(16), np.zeros(1)
    for _ in range(3000):
        A1 = np.tanh(X_tr @ W1 + b1)
        P = 1 / (1 + np.exp(-(A1 @ W2 + b2)[:, 0]))
        dZ2 = (P - y_tr)[:, None] / len(y_tr)
        dW2, db2 = A1.T @ dZ2, dZ2.sum(axis=0)
        dZ1 = (dZ2 @ W2.T) * (1 - A1 ** 2)
        dW1, db1 = X_tr.T @ dZ1, dZ1.sum(axis=0)
        W1 -= dW1
        b1 -= db1
        W2 -= dW2
        b2 -= db2
    p_te = 1 / (1 + np.exp(-(np.tanh(X_te @ W1 + b1) @ W2 + b2)[:, 0]))
    test_acc = float(((p_te > 0.5) == y_te).mean())
    logreg_acc = LogisticRegression().fit(X_tr, y_tr).score(X_te, y_te)
    ### END CODE HERE ###
    print(f"MLP numpy: {test_acc:.3f} | logistic: {logreg_acc:.3f}")
  tests: |
    check_greater(test_acc, 0.95, "mạng nơ-ron học được biên phi tuyến")
    check_greater(test_acc - logreg_acc, 0.05, "hơn hồi quy logistic ≥ 5 điểm")
