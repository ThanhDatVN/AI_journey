title: "39 · ML Systems"
sections:
  theory:
    questions:
      - id: t01
        topic: ml system components
        lesson: 01_ml_system_design.ipynb
        type: multi
        question: "Những thành phần nào thuộc một hệ thống ML production (ngoài code mô hình)?"
        options: {a: "Thu thập và kiểm tra dữ liệu", b: "Tính đặc trưng / feature store", c: "Phục vụ và giám sát", d: "Vòng phản hồi và huấn luyện lại"}
        answer: abcd
        explanation: "Code mô hình chỉ là một phần nhỏ (Sculley et al., 2015)."
      - id: t02
        topic: point-in-time leakage
        lesson: 01_ml_system_design.ipynb
        type: mcq
        question: "Mô hình churn có AUC offline 0.99 nhưng khi triển khai chỉ 0.60. Đặc trưng được tính trên toàn bộ lịch sử đến hôm nay. Nguyên nhân khả dĩ nhất:"
        options: {a: "Rò rỉ thời điểm — đặc trưng dùng thông tin sau thời điểm dự đoán", b: "Mô hình quá đơn giản", c: "Tập test quá nhỏ", d: "Thiếu điều chỉnh siêu tham số"}
        answer: a
        explanation: "Đặc trưng phải tính 'như tại thời điểm dự đoán' (point-in-time correct)."
      - id: t03
        topic: random split
        lesson: 01_ml_system_design.ipynb
        type: tf
        question: "Chia train/test ngẫu nhiên đủ để phát hiện rò rỉ thời điểm trong đặc trưng."
        answer: false
        explanation: "Cả train và test đều mang cùng rò rỉ; cần xây dữ liệu đúng thời điểm và đánh giá theo thời gian."
      - id: t04
        topic: training-serving skew
        lesson: 01_ml_system_design.ipynb
        type: mcq
        question: "Cách phòng tránh lệch train/serving hiệu quả nhất là:"
        options: {a: "Đóng gói tiền xử lý cùng mô hình và dùng chung một đường đặc trưng cho train và serve", b: "Viết lại logic tiền xử lý cẩn thận ở dịch vụ phục vụ", c: "Huấn luyện lại thường xuyên hơn", d: "Dùng mô hình phức tạp hơn"}
        answer: a
        explanation: "Không viết lại logic — gọi đúng đối tượng đã huấn luyện; thêm kiểm thử parity."
      - id: t05
        topic: system constraints
        lesson: 01_ml_system_design.ipynb
        type: mcq
        question: "API yêu cầu độ trễ p99 < 5 ms. Mô hình A: AUC 0.810, p99 1 ms; mô hình B: AUC 0.811, p99 17 ms. Nên chọn:"
        options: {a: "A — B vi phạm ràng buộc độ trễ và chỉ hơn không đáng kể", b: "B — AUC cao hơn", c: "Trung bình hai mô hình", d: "Không chọn được"}
        answer: a
        explanation: "Chọn theo cả metric mô hình và ràng buộc vận hành."
      - id: t06
        topic: batch vs online
        lesson: 01_ml_system_design.ipynb
        type: mcq
        question: "Danh sách khách cần gọi giữ chân được cập nhật mỗi đêm. Kiểu phục vụ phù hợp:"
        options: {a: "Batch", b: "Online API", c: "Streaming", d: "Trên thiết bị người dùng"}
        answer: a
        explanation: "Không cần kết quả tức thì."
      - id: t07
        topic: reproducibility levels
        lesson: 02_reproducibility_and_experiment_tracking.ipynb
        type: mcq
        question: "Đồng nghiệp chạy code, dữ liệu và cấu hình của bạn trên máy họ và ra cùng kết quả. Đây là:"
        options: {a: "Tái lập (reproducible)", b: "Lặp lại (repeatable)", c: "Tái hiện (replicable)", d: "Tổng quát hoá"}
        answer: a
        explanation: "Lặp lại: máy mình; tái hiện: dữ liệu mới."
      - id: t08
        topic: seeds
        lesson: 02_reproducibility_and_experiment_tracking.ipynb
        type: tf
        question: "Cố định random_state làm kết quả lặp lại được và đồng thời loại bỏ độ bất định của ước lượng hiệu năng."
        answer: false
        explanation: "Seed chỉ chọn một điểm trong phân phối kết quả; cần đo độ biến thiên theo seed/lần chia."
      - id: t09
        topic: paired comparison
        lesson: 02_reproducibility_and_experiment_tracking.ipynb
        type: mcq
        question: "So sánh hai mô hình trên cùng 20 lần chia theo cặp chính xác hơn so hai trung bình độc lập vì:"
        options: {a: "Độ khó của từng tập test tác động cả hai mô hình như nhau và bị triệt tiêu trong hiệu", b: "Có nhiều dữ liệu hơn", c: "Mô hình được huấn luyện lâu hơn", d: "Không có lý do"}
        answer: a
        explanation: "Phương sai của hiệu theo cặp nhỏ hơn nhiều."
      - id: t10
        topic: hidden nondeterminism
        lesson: 02_reproducibility_and_experiment_tracking.ipynb
        type: multi
        question: "Nguồn bất định nào có thể làm kết quả thay đổi dù đã cố định seed của mô hình?"
        options: {a: "Thứ tự duyệt set chuỗi (PYTHONHASHSEED)", b: "Thứ tự cộng số thực khi tính song song", c: "Phiên bản thư viện khác", d: "Dữ liệu nguồn được cập nhật"}
        answer: abcd
        explanation: "Cần sắp xếp tường minh, thuật toán tất định, lock file, hash dữ liệu."
      - id: t11
        topic: winner's curse
        lesson: 02_reproducibility_and_experiment_tracking.ipynb
        type: mcq
        question: "Thử 100 cấu hình, chọn cấu hình có AUC validation cao nhất. AUC validation của nó:"
        options: {a: "Lạc quan so với hiệu năng thật — cần đánh giá lại trên test chưa dùng", b: "Không chệch", c: "Bi quan", d: "Bằng AUC test"}
        answer: a
        explanation: "Lời nguyền người thắng; nặng hơn khi validation nhỏ."
      - id: t12
        topic: experiment tracking
        lesson: 02_reproducibility_and_experiment_tracking.ipynb
        type: multi
        question: "Một run thí nghiệm nên ghi lại:"
        options: {a: "Mọi siêu tham số kể cả seed", b: "Hash/phiên bản dữ liệu", c: "Commit code và phiên bản thư viện", d: "Chỉ metric tốt nhất"}
        answer: abc
        explanation: "Ghi mọi run (kể cả thất bại) để tái lập và để biết đã thử bao nhiêu cấu hình."
      - id: t13
        topic: pickle security
        lesson: 03_packaging_and_model_registry.ipynb
        type: mcq
        question: "Vì sao không được joblib.load một file mô hình tải từ nguồn không tin cậy?"
        options: {a: "Pickle có thể thực thi code tuỳ ý khi nạp", b: "File quá lớn", c: "Dự đoán sẽ chậm", d: "Phiên bản Python khác"}
        answer: a
        explanation: "__reduce__ chỉ định hàm sẽ được gọi khi unpickle; dùng skops/safetensors/ONNX hoặc kiểm tra hash."
      - id: t14
        topic: __main__ pitfall
        lesson: 03_packaging_and_model_registry.ipynb
        type: mcq
        question: "Pipeline dùng FunctionTransformer với hàm định nghĩa trong notebook. Server báo \"Can't get attribute ... on module '__main__'\". Cách khắc phục đúng:"
        options: {a: "Đưa hàm vào một package có thể import, cài ở cả môi trường train và serve", b: "Dùng pickle protocol cao hơn", c: "Đổi tên hàm", d: "Lưu bằng CSV"}
        answer: a
        explanation: "Pickle chỉ lưu tham chiếu module.tên, không lưu code."
      - id: t15
        topic: input validation
        lesson: 03_packaging_and_model_registry.ipynb
        type: tf
        question: "Pipeline có OneHotEncoder(handle_unknown='ignore') sẽ báo lỗi khi nhận một loại hợp đồng gõ sai."
        answer: false
        explanation: "Giá trị lạ thành vector 0 và mô hình vẫn trả xác suất — cần kiểm tra schema trước."
      - id: t16
        topic: registry
        lesson: 03_packaging_and_model_registry.ipynb
        type: mcq
        question: "Champion mới gây sự cố. Với model registry dùng alias, cách rollback nhanh nhất:"
        options: {a: "Trỏ alias champion về phiên bản trước", b: "Huấn luyện lại mô hình cũ", c: "Sửa code phục vụ và deploy lại", d: "Xoá phiên bản mới rồi đăng ký lại"}
        answer: a
        explanation: "Phiên bản bất biến + alias → rollback là đổi con trỏ."
      - id: t17
        topic: promotion gate
        lesson: 03_packaging_and_model_registry.ipynb
        type: multi
        question: "Cổng thăng hạng mô hình nên kiểm tra:"
        options: {a: "Metric tổng trên holdout cố định", b: "Metric trong từng nhóm quan trọng", c: "Độ trễ và schema đầu vào", d: "Chỉ loss huấn luyện"}
        answer: abc
        explanation: "AUC tổng tăng vẫn có thể làm một nhóm tệ đi."
  math:
    questions:
      - id: m01
        topic: point-in-time feature
        lesson: 01_ml_system_design.ipynb
        type: numeric
        decimals: 0
        question: "Nhật ký hoạt động ngày 0→9: [1, 0, 1, 1, 0, 1, 0, 0, 0, 0]. Dự đoán tại as_of = 6 (chỉ dùng ngày < 6). days_since_last = as_of − 1 − (ngày hoạt động gần nhất) = ?"
        answer: 0
        explanation: "Ngày hoạt động gần nhất trước 6 là ngày 5 → 6 − 1 − 5 = 0."
      - id: m02
        topic: leaky feature
        lesson: 01_ml_system_design.ipynb
        type: numeric
        decimals: 0
        question: "Cùng nhật ký trên, nếu tính trên toàn bộ dữ liệu (as_of = 10): days_since_last = ?"
        answer: 4
        explanation: "10 − 1 − 5 = 4 — thông tin tương lai (khách đã ngừng hoạt động)."
      - id: m03
        topic: paired t
        lesson: 02_reproducibility_and_experiment_tracking.ipynb
        type: numeric
        decimals: 2
        question: "Chênh lệch AUC theo cặp trên 4 fold: trung bình 0.01, độ lệch chuẩn 0.01. Thống kê t = d̄ / (s/√n) = ?"
        answer: 2
        explanation: "0.01 / (0.01/2)."
      - id: m04
        topic: latency budget
        lesson: 01_ml_system_design.ipynb
        type: numeric
        decimals: 0
        question: "Ngân sách độ trễ API 50 ms; tải đặc trưng mất 18 ms, mạng và tuần tự hoá 12 ms. Thời gian tối đa cho mô hình (ms) = ?"
