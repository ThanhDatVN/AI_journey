coding:
  tasks:
    - id: c01
      title: IoU hai hộp
      prompt: |
        Viết `iou(a, b)` cho hai hộp dạng [x1, y1, x2, y2] (list hoặc tuple); trả về 0 nếu không giao nhau.
      code: |
        def iou(a, b):
            ### START CODE HERE ### (≈ 5 dòng)
            w = max(0.0, min(a[2], b[2]) - max(a[0], b[0]))
            h = max(0.0, min(a[3], b[3]) - max(a[1], b[1]))
            inter = w * h
            union = (a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - inter
            return inter / union
            ### END CODE HERE ###
      tests: |
        check_close(iou([0, 0, 10, 10], [0, 0, 10, 10]), 1.0, message="trùng nhau")
        check_close(iou([0, 0, 10, 10], [5, 5, 15, 15]), 25 / 175, message="chồng 1/4")
        check_close(iou([0, 0, 10, 10], [20, 20, 30, 30]), 0.0, message="không giao")
        check_close(iou([0, 0, 4, 4], [2, 0, 6, 4]), 1 / 3, message="nửa chồng")
    - id: c02
      title: Dice và IoU của mask
      prompt: |
        Viết `mask_scores(pred, true)` cho hai mảng bool cùng shape, trả về `(dice, iou)`; nếu cả hai rỗng trả về `(1.0, 1.0)`.
      code: |
        def mask_scores(pred, true):
            ### START CODE HERE ### (≈ 5 dòng)
            inter = np.logical_and(pred, true).sum()
            total = pred.sum() + true.sum()
            if total == 0:
                return 1.0, 1.0
            return 2 * inter / total, inter / (total - inter)
            ### END CODE HERE ###
      tests: |
        a = np.zeros((10, 10), bool); a[:5] = True
        b = np.zeros((10, 10), bool); b[2:7] = True
        d, j = mask_scores(a, b)
        check_close(d, 2 * 30 / 100, message="Dice")
        check_close(j, 30 / 70, message="IoU")
        check_close(mask_scores(np.zeros((3, 3), bool), np.zeros((3, 3), bool)), (1.0, 1.0), message="cả hai rỗng")
        check_close(d, 2 * j / (1 + j), message="Dice = 2·IoU/(1 + IoU)")
analysis:
  prompt: |
    Một bệnh viện muốn phát hiện khối u trên ảnh X-quang ngực. Có 800 ảnh có nhãn hộp (một số ảnh có nhiều khối u nhỏ), lấy từ 2 bệnh viện;
    80% ảnh bệnh viện 1 có khối u, chỉ 20% ảnh bệnh viện 2 có. Nhóm đề xuất: (1) train detector từ đầu; (2) augmentation: lật dọc, xoay 0–360°,
    đổi màu mạnh; (3) chia train/test ngẫu nhiên theo ảnh; (4) báo cáo pixel accuracy và mAP@0.5. Đánh giá và đề xuất.
  rubric:
    - "Nêu nguy cơ shortcut: mô hình học dấu hiệu nhận diện bệnh viện (ký hiệu trên phim, độ sáng) vì tỉ lệ khối u khác nhau giữa hai nơi → đánh giá theo bệnh viện, cân bằng/kiểm tra"
    - "Augmentation phải giữ nhãn/hợp lý: X-quang có hướng chuẩn (lật trái-phải đổi vị trí tim, ký hiệu L/R), xoay 360° và đổi màu mạnh không thực tế; biến đổi hình học phải áp dụng lên hộp"
    - "800 ảnh ít → transfer learning từ mô hình tiền huấn luyện (tốt nhất trên ảnh y tế), không train từ đầu"
    - "Chia theo bệnh nhân (nhiều ảnh/bệnh nhân) và theo bệnh viện; tránh rò rỉ"
    - "Metric: pixel accuracy không dùng cho detection; mAP + recall/độ nhạy ở ngưỡng vận hành, phân tích theo kích thước khối u (khối nhỏ), FP/ảnh; có bác sĩ đánh giá"
  sample_answer: |
    (1) 800 ảnh không đủ train từ đầu → fine-tune detector tiền huấn luyện (COCO, hoặc tốt hơn là backbone tiền huấn luyện trên X-quang).
    (2) Lật dọc/xoay 360° tạo ảnh không thể gặp (X-quang chụp theo tư thế chuẩn), lật ngang đổi vị trí tim và ký hiệu L/R; màu không có ý nghĩa với
    ảnh xám — dùng xoay nhỏ, đổi sáng/tương phản, nhiễu nhẹ, và biến đổi hộp tương ứng. (3) Tỉ lệ khối u khác nhau giữa hai bệnh viện → mô hình có
    thể học "ảnh của bệnh viện 1" (ký hiệu, độ sáng) thay vì khối u; đánh giá riêng theo bệnh viện, kiểm tra vùng mô hình nhìn vào; chia theo bệnh
    nhân để tránh rò rỉ. (4) Pixel accuracy vô nghĩa cho detection; báo cáo mAP và độ nhạy ở ngưỡng vận hành, số FP mỗi ảnh, kết quả theo kích
    thước khối u; so với bác sĩ; mô hình chỉ hỗ trợ, không thay thế chẩn đoán.
project:
  prompt: |
    **Mini project — Phân loại hình khi ít dữ liệu.** Chỉ có 300 ảnh train (`make_shapes(300, seed=0)`), test trên `make_shapes(1000, seed=1)`.
    Dùng CNN + data augmentation phù hợp để đạt accuracy test `acc` ≥ 0.88 (không augmentation chỉ khoảng 0.73).
  code: |
    import torch
    import torch.nn.functional as F
    from torch import nn

    from ml_course.datasets import make_shapes

    device = "cuda" if torch.cuda.is_available() else "cpu"
    X, y = make_shapes(300, seed=0)
    X_test, y_test = make_shapes(1000, seed=1)
    X, X_test = torch.tensor(X[:, None]), torch.tensor(X_test[:, None])
    y, y_test = torch.tensor(y), torch.tensor(y_test)
    ### START CODE HERE ### (≈ 25 dòng)
    def shift_flip(x, g, max_shift=0.15):
        B = x.shape[0]
        shift = (torch.rand(2, B, generator=g) * 2 - 1) * max_shift * 2
        sx = torch.where(torch.rand(B, generator=g) < 0.5, -1.0, 1.0)
        zeros, ones = torch.zeros(B), torch.ones(B)
        theta = torch.stack([torch.stack([sx, zeros, shift[0]], 1), torch.stack([zeros, ones, shift[1]], 1)], 1)
        return F.grid_sample(x, F.affine_grid(theta, x.shape, align_corners=False), align_corners=False)

    torch.manual_seed(0)
    model = nn.Sequential(nn.Conv2d(1, 16, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),
                          nn.Conv2d(16, 32, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),
                          nn.Conv2d(32, 64, 3, padding=1), nn.ReLU(), nn.Flatten(), nn.Linear(64 * 7 * 7, 5)).to(device)
    opt = torch.optim.Adam(model.parameters(), lr=1e-3)
    g = torch.Generator().manual_seed(0)
    for _ in range(1500):
        model.train()
        idx = torch.randint(0, len(X), (64,), generator=g)
        opt.zero_grad()
        F.cross_entropy(model(shift_flip(X[idx], g).to(device)), y[idx].to(device)).backward()
        opt.step()
    model.eval()
    with torch.no_grad():
        acc = (model(X_test.to(device)).argmax(1).cpu() == y_test).float().mean().item()
    ### END CODE HERE ###
    print(f"accuracy test = {acc:.3f}")
  tests: |
    check_greater(acc, 0.88, "accuracy test ≥ 0.88")
