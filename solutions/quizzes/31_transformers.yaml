        lesson: 03_mini_gpt.ipynb
        type: mcq
        question: "Mô hình ngôn ngữ có loss train giảm về gần 0 rất nhanh nhưng sinh văn bản vô nghĩa. Nghi ngờ hàng đầu:"
        options: {a: "Causal mask sai — mô hình nhìn thấy token cần dự đoán", b: "Learning rate quá nhỏ", c: "Dữ liệu quá ít", d: "Dùng weight tying"}
        answer: a
        explanation: "Kiểm tra: đổi token tương lai, logits quá khứ phải giữ nguyên."
      - id: t11
        topic: sampling
        lesson: 03_mini_gpt.ipynb
        type: mcq
        question: "Top-p (nucleus) sampling:"
        options: {a: "Giữ tập nhỏ nhất các token có tổng xác suất ≥ p rồi lấy mẫu trong đó", b: "Luôn giữ đúng p token", c: "Chọn token xác suất cao nhất", d: "Chia logits cho p"}
        answer: a
        explanation: "Số ứng viên tự co giãn theo độ chắc chắn."
      - id: t12
        topic: kv cache
        lesson: 03_mini_gpt.ipynb
        type: tf
        question: "KV cache thay đổi kết quả sinh văn bản so với tính lại toàn bộ chuỗi mỗi bước."
        answer: false
        explanation: "Kết quả giống hệt; chỉ bớt tính toán."
      - id: t13
        topic: copy task
        lesson: 03_mini_gpt.ipynb
        type: mcq
        question: "Trên bài sao chép đoạn token ngẫu nhiên, GPT nhỏ giải được còn LSTM thì không vì:"
        options: {a: "Attention truy cập trực tiếp vị trí cũ; LSTM phải nén mọi token vào trạng thái ẩn", b: "GPT có nhiều tham số hơn", c: "LSTM không có embedding", d: "GPT dùng dropout"}
        answer: a
