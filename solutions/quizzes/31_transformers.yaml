      - id: t14
        topic: families
        lesson: 04_encoder_decoder_bert_gpt_vit.ipynb
        type: mcq
        question: "Cross-attention trong decoder của mô hình encoder–decoder lấy:"
        options: {a: "Query từ decoder, key và value từ đầu ra encoder", b: "Query, key, value đều từ encoder", c: "Query từ encoder, key/value từ decoder", d: "Chỉ value từ encoder"}
        answer: a
        explanation: "Giống attention seq2seq chương 30."
      - id: t15
        topic: bert
        lesson: 04_encoder_decoder_bert_gpt_vit.ipynb
        type: multi
        question: "Về BERT:"
        options:
          a: "Attention hai chiều, tiền huấn luyện bằng masked language modeling"
          b: "Phù hợp phân loại văn bản sau khi fine-tune"
          c: "Biểu diễn của token [CLS] thường dùng cho phân loại"
          d: "Là mô hình sinh văn bản tự hồi quy"
        answer: abc
        explanation: "Sinh tự hồi quy là GPT."
      - id: t16
        topic: vit
        lesson: 04_encoder_decoder_bert_gpt_vit.ipynb
        type: mcq
        question: "Train từ đầu trên ít ảnh, ViT thường thua CNN vì:"
        options: {a: "ViT ít inductive bias (cục bộ, bất biến dịch) nên cần nhiều dữ liệu hơn", b: "ViT không xử lý được ảnh xám", c: "ViT không có tham số học được", d: "CNN dùng attention"}
        answer: a
        explanation: "Cần tiền huấn luyện lớn hoặc augmentation mạnh."
