        topic: soft lookup
        lesson: 01_attention_from_scratch.ipynb
        type: mcq
        question: "Đầu ra của attention cho một query là:"
        options: {a: "Trung bình có trọng số của các value, trọng số = softmax của điểm query–key", b: "Value có key giống query nhất (argmax)", c: "Tổng các key", d: "Trung bình cộng các query"}
