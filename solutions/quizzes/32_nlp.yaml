coding:
  tasks:
    - id: c01
      title: Bỏ dấu tiếng Việt
      prompt: |
        Viết `strip_accents(s)`: chữ thường, bỏ mọi dấu thanh và dấu mũ/móc (dùng `unicodedata.normalize("NFD", ...)` và bỏ ký tự loại "Mn"),
        chuyển "đ" thành "d". Phải đúng cả khi đầu vào ở dạng NFC hay NFD.
      code: |
        import unicodedata

        def strip_accents(s):
            ### START CODE HERE ### (≈ 2 dòng)
            s = unicodedata.normalize("NFD", s.lower()).replace("đ", "d")
            return "".join(c for c in s if unicodedata.category(c) != "Mn")
            ### END CODE HERE ###
      tests: |
        check_equal(strip_accents("Đường Lê Lợi"), "duong le loi", "đ và dấu")
        check_equal(strip_accents("Hội An, Phú Quốc"), "hoi an, phu quoc", "dấu thanh + mũ")
        check_equal(strip_accents(unicodedata.normalize("NFD", "Việt Nam")), "viet nam", "đầu vào NFD")
        check_equal(strip_accents("abc 123"), "abc 123", "không đổi chữ không dấu")
    - id: c02
      title: Recall@k và MRR
      prompt: |
        Viết `retrieval_metrics(scores, gold, k)`: `scores` mảng (n_truy_vấn, n_tài_liệu), `gold[i]` chỉ số tài liệu đúng của truy vấn i.
        Hạng của tài liệu đúng = 1 + số tài liệu có điểm **lớn hơn hẳn** nó. Trả về `(recall_at_k, mrr)`.
      code: |
        def retrieval_metrics(scores, gold, k):
            ### START CODE HERE ### (≈ 2 dòng)
            ranks = np.array([(s > s[g]).sum() + 1 for s, g in zip(scores, gold)])
            return np.mean(ranks <= k), np.mean(1 / ranks)
            ### END CODE HERE ###
      tests: |
        S = np.array([[0.9, 0.1, 0.3], [0.2, 0.5, 0.8], [0.1, 0.2, 0.3]])
        r, m = retrieval_metrics(S, [0, 1, 0], k=2)
        check_close(r, 2 / 3, message="Recall@2: hạng 1, 2, 3")
        check_close(m, (1 + 1 / 2 + 1 / 3) / 3, message="MRR")
        check_close(retrieval_metrics(S, [0, 2, 2], k=1), (1.0, 1.0), message="mọi truy vấn đúng ở hạng 1")
analysis:
  prompt: |
    Một ngân hàng muốn tự động phân loại 50 000 tin nhắn khách hàng (tiếng Việt, nhiều tin gõ không dấu, viết tắt, lỗi chính tả) vào 20 nhóm
    yêu cầu. Họ có 400 tin đã gán nhãn. Kỹ sư đề xuất: (1) bỏ dấu và bỏ stopword theo danh sách tiếng Anh dịch sang; (2) tách từ bằng
    khớp cực đại với một từ điển chung; (3) unigram TF-IDF + logistic regression, đánh giá bằng accuracy trên 10% dữ liệu, chia ngẫu nhiên;
    (4) nếu chưa đủ tốt thì "chuyển sang Transformer train từ đầu". Đánh giá và đề xuất.
  rubric:
    - "Chuẩn hoá: NFC, thống nhất kiểu dấu, xử lý không dấu/viết tắt/lỗi chính tả (n-gram ký tự, từ điển viết tắt); cảnh báo bỏ dấu gây trùng nghĩa và stopword làm mất phủ định"
    - "Biểu diễn: thêm bigram/n-gram ký tự; từ điển tách từ chung không phủ thuật ngữ ngân hàng → subword hoặc từ điển miền"
    - "Đánh giá: 20 lớp mất cân bằng → macro-F1/ma trận nhầm lẫn; 40 mẫu test quá ít, dùng cross-validation phân tầng; chú ý tin trùng lặp giữa train/test"
    - "Ít nhãn: tận dụng 50 000 tin không nhãn (embedding/tiền huấn luyện), fine-tune mô hình tiếng Việt có sẵn (PhoBERT) thay vì train Transformer từ đầu; gán nhãn thêm có chủ đích"
    - "Phân tích lỗi trước khi đổi mô hình; nêu rủi ro (dữ liệu cá nhân, tin nhắn khẩn cấp cần ưu tiên)"
  sample_answer: |
    (1) Chuẩn hoá NFC, thống nhất kiểu dấu; có thể thêm trường không dấu cho so khớp nhưng giữ bản có dấu cho mô hình; không dùng danh sách
    stopword dịch máy (mất "không", "chưa"). Viết tắt/lỗi chính tả: n-gram ký tự, từ điển viết tắt miền ngân hàng. (2) Từ điển chung thiếu
    thuật ngữ (sao kê, OTP, chuyển khoản liên ngân hàng) → từ điển miền hoặc subword. (3) Unigram bỏ phủ định/từ ghép → thêm bigram, n-gram ký tự;
    20 lớp mất cân bằng: dùng macro-F1, ma trận nhầm lẫn; 10% của 400 = 40 tin quá ít → cross-validation phân tầng; loại tin trùng giữa train/test.
    (4) 400 nhãn không đủ train Transformer từ đầu; tận dụng 50 000 tin không nhãn (embedding, tiếp tục tiền huấn luyện) và fine-tune PhoBERT;
    active learning để gán nhãn thêm. Luôn phân tích lỗi; bảo mật dữ liệu khách hàng; nhóm khẩn cấp (mất thẻ, lừa đảo) cần recall cao.
project:
  prompt: |
    **Mini project — Phân loại chủ đề tin tức.** Dữ liệu `make_news_vi(4000, seed=0)`, chia `train_test_split(test_size=0.3, random_state=0,
    stratify=topic)`. Xây pipeline vectorizer + mô hình tuyến tính, lưu macro-F1 trên tập test vào `macro_f1`. Yêu cầu `macro_f1` ≥ 0.95
    (gợi ý: unigram chưa đủ).
  code: |
    from sklearn.feature_extraction.text import TfidfVectorizer
    from sklearn.metrics import f1_score
    from sklearn.model_selection import train_test_split
    from sklearn.pipeline import make_pipeline
    from sklearn.svm import LinearSVC

    from ml_course.datasets import make_news_vi

    news = make_news_vi(4000, seed=0)
    train, test = train_test_split(news, test_size=0.3, random_state=0, stratify=news.topic)
    ### START CODE HERE ### (≈ 3 dòng)
    model = make_pipeline(TfidfVectorizer(ngram_range=(1, 2)), LinearSVC(C=1.0))
    model.fit(train.text, train.topic)
    macro_f1 = f1_score(test.topic, model.predict(test.text), average="macro")
    ### END CODE HERE ###
    print(f"macro-F1 = {macro_f1:.3f}")
  tests: |
    check_greater(macro_f1, 0.95, "macro-F1 ≥ 0.95")
