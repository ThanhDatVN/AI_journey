title: "04 · Data Preprocessing"
sections:
  theory:
    questions:
      - id: t01
        topic: fit trên train
        lesson: 01_missing_values_and_outliers.ipynb
        type: mcq
        question: "Cách nào ĐÚNG khi dùng SimpleImputer?"
        options:
          a: "fit trên toàn bộ dữ liệu rồi chia train/test"
          b: "fit trên train, transform cả train và test"
          c: "fit riêng trên train và riêng trên test"
          d: "fit trên test để sát dữ liệu thật"
        answer: b
        explanation: "Tham số (median...) chỉ học từ train để mô phỏng đúng tình huống triển khai."
      - id: t02
        topic: cột chỉ báo missing
        lesson: 01_missing_values_and_outliers.ipynb
        type: tf
        question: "Thêm cột is_missing hữu ích khi việc thiếu dữ liệu có liên hệ với target hoặc biến khác (MAR/MNAR)."
        answer: true
        explanation: "Bản thân việc 'bị thiếu' là thông tin model có thể học."
      - id: t03
        topic: xử lý outlier
        lesson: 01_missing_values_and_outliers.ipynb
        type: multi
        question: "Những cách nào giảm ảnh hưởng của outlier mà KHÔNG xoá dữ liệu?"
        options: {a: "Clip theo phân vị học từ train", b: "Biến đổi log", c: "RobustScaler", d: "MinMaxScaler"}
        answer: abc
        explanation: "MinMaxScaler còn nhạy với outlier hơn."
      - id: t04
        topic: z-score
        lesson: 02_feature_scaling.ipynb
        type: mcq
        question: "Trong công thức z-score x' = (x − μ)/σ, σ là gì?"
        options: {a: "Phương sai", b: "Độ lệch chuẩn", c: "Khoảng tứ phân vị", d: "Giá trị lớn nhất"}
        answer: b
        explanation: "σ là độ lệch chuẩn (căn bậc hai của phương sai)."
      - id: t05
        topic: scaling vs biến đổi phân phối
        lesson: 02_feature_scaling.ipynb
        type: mcq
        question: "Phép biến đổi nào làm thay đổi HÌNH DẠNG phân phối của feature?"
        options: {a: "Min-max scaling", b: "Standardization", c: "Box-Cox", d: "RobustScaler"}
        answer: c
        explanation: "Scaling chỉ đổi phạm vi; Box-Cox/log là biến đổi phi tuyến đổi hình dạng."
      - id: t06
        topic: model cần scaling
        lesson: 02_feature_scaling.ipynb
        type: multi
        question: "Model nào thường CẦN scaling feature?"
        options: {a: KNN, b: "SVM", c: "Random Forest", d: "Logistic Regression có regularization"}
        answer: abd
        explanation: "Random Forest so sánh ngưỡng trên từng feature nên không cần."
      - id: t07
        topic: one-hot vs label encoding
        lesson: 03_encoding_categorical.ipynb
        type: mcq
        question: "Vì sao không nên mã hoá 'quận' thành 0, 1, 2, 3 cho Linear Regression?"
        options:
          a: "Tạo ra thứ tự và khoảng cách giả giữa các quận"
          b: "Tốn bộ nhớ"
          c: "Linear Regression không nhận số nguyên"
          d: "Làm model chạy chậm"
        answer: a
        explanation: "Model hiểu 'Quận 3 = trung bình của Quận 1 và Quận 7' — vô nghĩa."
      - id: t08
        topic: handle_unknown
        lesson: 03_encoding_categorical.ipynb
        type: mcq
        question: "OneHotEncoder(handle_unknown='ignore') xử lý category chưa gặp khi train như thế nào?"
        options: {a: "Báo lỗi", b: "Mã hoá thành vector toàn 0", c: "Gán vào category phổ biến nhất", d: "Xoá hàng đó"}
        answer: b
        explanation: "Giúp hệ thống không bị sập khi gặp giá trị mới."
      - id: t09
        topic: target encoding leakage
        lesson: 03_encoding_categorical.ipynb
        type: mcq
        question: "Cách khắc phục leakage của target encoding?"
        options:
          a: "Tính trung bình target trên toàn bộ dữ liệu"
          b: "Out-of-fold encoding cho train + smoothing về trung bình chung"
          c: "Chỉ dùng cho category hiếm"
          d: "Dùng thêm one-hot"
        answer: b
        explanation: "Mỗi hàng được encode bằng thống kê không chứa nhãn của chính nó."
      - id: t10
        topic: ordinal encoding
        lesson: 03_encoding_categorical.ipynb
        type: tf
        question: "OrdinalEncoder() mặc định tự hiểu thứ tự S < M < L < XL."
        answer: false
        explanation: "Mặc định sắp theo bảng chữ cái; phải truyền categories=[[...]] theo đúng thứ tự."
      - id: t11
        topic: pipeline & CV
        lesson: 04_pipelines_and_column_transformer.ipynb
        type: mcq
        question: "Vì sao nên đưa CẢ pipeline (tiền xử lý + model) vào cross_val_score?"
        options:
          a: "Chạy nhanh hơn"
          b: "Các bước tiền xử lý được fit lại trong từng fold → không rò rỉ thông tin từ fold validation"
          c: "Để dùng được GPU"
          d: "Bắt buộc về cú pháp"
        answer: b
        explanation: "Đây là cách duy nhất đánh giá đúng toàn bộ quy trình."
      - id: t12
        topic: tham số lồng nhau
        lesson: 04_pipelines_and_column_transformer.ipynb
        type: text
        question: "Trong Pipeline có bước tên 'model' là Ridge, khoá trong param_grid để tìm 'alpha' là gì?"
        answer: ["model__alpha"]
        explanation: "Cú pháp tên_bước__tên_tham_số (hai dấu gạch dưới)."
  math:
    questions:
      - id: m01
        topic: min-max
        lesson: 02_feature_scaling.ipynb
        type: numeric
        decimals: 2
        question: "Train có min = 20, max = 100. Giá trị 60 sau min-max scaling bằng?"
        answer: 0.5
        explanation: "(60 − 20)/(100 − 20) = 0.5."
      - id: m02
        topic: z-score
        lesson: 02_feature_scaling.ipynb
        type: numeric
        decimals: 2
        question: "μ = 50, σ = 8. z-score của 70?"
        answer: 2.5
        explanation: "(70 − 50)/8 = 2.5."
      - id: m03
        topic: one-hot
        lesson: 03_encoding_categorical.ipynb
        type: numeric
        decimals: 0
        question: "One-hot 3 cột phân loại có lần lượt 4, 3, 5 category (giữ đủ K cột, không drop) tạo ra bao nhiêu cột?"
        answer: 12
        explanation: "4 + 3 + 5 = 12."
      - id: m04
        topic: smoothing target encoding
        lesson: 03_encoding_categorical.ipynb
        type: numeric
        decimals: 3
        question: "Category có n = 5 mẫu với tỉ lệ churn 0.8; tỉ lệ chung 0.3; m = 10. Giá trị target encoding có smoothing = (n·ȳc + m·ȳ)/(n + m) = ?"
        answer: 0.4667
        explanation: "(5·0.8 + 10·0.3)/15 = 7/15 ≈ 0.467."
coding:
  tasks:
    - id: c01
      title: Min-max scaler from scratch
      prompt: |
        Hoàn thành `MinMaxScalerManual`: `fit` học `min_`, `max_` theo cột; `transform` trả về $(x - min)/(max - min)$, cột hằng chia cho 1.
      code: |
        class MinMaxScalerManual:
            def fit(self, X):
                X = np.asarray(X, dtype=float)
                ### START CODE HERE ### (≈ 3 dòng)
                self.min_ = X.min(axis=0)
                self.max_ = X.max(axis=0)
                self.range_ = np.where(self.max_ - self.min_ == 0, 1.0, self.max_ - self.min_)
                ### END CODE HERE ###
                return self

            def transform(self, X):
                ### START CODE HERE ### (≈ 1 dòng)
                Z = (np.asarray(X, dtype=float) - self.min_) / self.range_
                ### END CODE HERE ###
                return Z
      tests: |
        from sklearn.preprocessing import MinMaxScaler
        X = np.c_[np.arange(10.0), np.full(10, 3.0)]
        s = MinMaxScalerManual().fit(X)
        check_close(s.transform(X), MinMaxScaler().fit_transform(X), message="khớp sklearn")
        check_close(s.transform([[20.0, 3.0]]), [[20 / 9, 0.0]], message="giá trị ngoài khoảng train")
project:
  prompt: |
    **Mini project — Pipeline dự đoán giá nhà (nối chương 03 + 04).** Với `house_prices_dirty.csv` (đã bỏ trùng lặp, chuẩn hoá `district`), target là **log** giá.
    Mốc tham khảo (MAE trên log-giá, 5-fold CV): dự đoán bằng trung bình ≈ 0.43; pipeline cơ bản ≈ 0.22.
    1. Sửa lỗi gõ diện tích (chương 03): nếu `area_m2 / bedrooms > 150` thì chia `area_m2` cho 10.
    2. Thay `area_m2` bằng `log(area_m2)` (giá tăng theo diện tích nhưng không tuyến tính).
    3. `Pipeline`: ColumnTransformer (số: median + indicator + scale; `district`: one-hot `handle_unknown="ignore"`; `has_garden`: passthrough) + `Ridge(alpha=1.0)`.
    Đạt **MAE < 0.12** (biến `cv_mae`).
  code: |
    import pandas as pd
    from sklearn.compose import ColumnTransformer
    from sklearn.impute import SimpleImputer
    from sklearn.linear_model import Ridge
    from sklearn.model_selection import cross_val_score
    from sklearn.pipeline import Pipeline
    from sklearn.preprocessing import OneHotEncoder, StandardScaler

    df = pd.read_csv("../../data/sample/house_prices_dirty.csv").drop_duplicates()
    df["district"] = df["district"].str.strip().str.lower().str.replace("q.", "quận", regex=False).str.title()
    X, y = df.drop(columns="price_billion_vnd"), np.log(df["price_billion_vnd"])
    num = ["area_m2", "bedrooms", "bathrooms", "age_years", "distance_to_center_km"]
    ### START CODE HERE ### (≈ 11 dòng)
    # STARTER: X = X.copy()
    # STARTER: cv_mae = None   # MAE 5-fold (thang log-giá) của Pipeline(tiền xử lý + Ridge)
    X = X.copy()
    bad = X["area_m2"] / X["bedrooms"] > 150
    X.loc[bad, "area_m2"] = X.loc[bad, "area_m2"] / 10
    X["area_m2"] = np.log(X["area_m2"])
    pre = ColumnTransformer([
        ("num", Pipeline([("imp", SimpleImputer(strategy="median", add_indicator=True)), ("sc", StandardScaler())]), num),
        ("cat", OneHotEncoder(handle_unknown="ignore"), ["district"]),
        ("bool", "passthrough", ["has_garden"]),
    ])
    pipe = Pipeline([("pre", pre), ("model", Ridge(alpha=1.0))])
    cv_mae = -cross_val_score(pipe, X, y, cv=5, scoring="neg_mean_absolute_error").mean()
    ### END CODE HERE ###
    print("CV MAE:", cv_mae)
  tests: |
    check_less(cv_mae, 0.12, "MAE log-giá < 0.12")
