title: "07 · Logistic Regression"
sections:
  theory:
    questions:
      - id: t01
        topic: linear regression cho phân loại
        lesson: 01_logistic_regression.ipynb
        type: multi
        question: "Vì sao Linear Regression không phù hợp cho bài toán phân loại?"
        options:
          a: "Đầu ra có thể < 0 hoặc > 1, không phải xác suất"
          b: "Các điểm 'dễ' ở xa làm dịch chuyển ngưỡng quyết định"
          c: "Linear Regression không chạy được với nhãn 0/1"
          d: "Linear Regression luôn overfit"
        answer: ab
        explanation: "Về kỹ thuật vẫn chạy được, nhưng ngưỡng không ổn định và đầu ra không phải xác suất."
      - id: t02
        topic: log-odds
        lesson: 01_logistic_regression.ipynb
        type: mcq
        question: "Logistic Regression là model tuyến tính cho đại lượng nào?"
        options: {a: "Xác suất p", b: "Odds p/(1−p)", c: "Log-odds log(p/(1−p))", d: "Nhãn y"}
        answer: c
        explanation: "logit(p) = wᵀx + b."
      - id: t03
        topic: odds ratio
        lesson: 01_logistic_regression.ipynb
        type: mcq
        question: "Hệ số w_j = 0.69 (≈ ln 2). Khi x_j tăng 1 đơn vị (giữ các feature khác), điều gì xảy ra?"
        options: {a: "Xác suất tăng gấp đôi", b: "Odds tăng gấp đôi", c: "Xác suất tăng 0.69", d: "Log-odds giảm một nửa"}
        answer: b
        explanation: "Odds nhân e^0.69 ≈ 2; xác suất KHÔNG nhân đôi."
      - id: t04
        topic: decision boundary
        lesson: 01_logistic_regression.ipynb
        type: mcq
        question: "Decision boundary của Logistic Regression (ngưỡng 0.5) là tập điểm thoả mãn:"
        options: {a: "θᵀx = 0.5", b: "θᵀx = 0", c: "σ(θᵀx) = 0", d: "θᵀx = 1"}
        answer: b
        explanation: "σ(z) = 0.5 ⇔ z = 0."
      - id: t05
        topic: cross-entropy vs MSE
        lesson: 01_logistic_regression.ipynb
        type: mcq
        question: "Vì sao dùng cross-entropy thay vì MSE cho Logistic Regression?"
        options:
          a: "Cross-entropy là negative log-likelihood (Bernoulli) và lồi theo θ; MSE với sigmoid không lồi"
          b: "MSE không tính được với nhãn 0/1"
          c: "Cross-entropy tính nhanh hơn"
          d: "Không có lý do, chỉ là quy ước"
        answer: a
        explanation: "MLE + tính lồi."
      - id: t06
        topic: gradient
        lesson: 01_logistic_regression.ipynb
        type: tf
        question: "Gradient của binary cross-entropy theo θ có dạng (1/m)Xᵀ(σ(Xθ) − y), cùng dạng với Linear Regression."
        answer: true
        explanation: "Sigmoid + cross-entropy 'triệt tiêu' nhau."
      - id: t07
        topic: sklearn C
        lesson: 02_from_scratch_and_optimization.ipynb
        type: mcq
        question: "Trong sklearn LogisticRegression, giảm C từ 1 xuống 0.01 thì:"
        options: {a: "Regularization yếu đi", b: "Regularization mạnh lên, hệ số co nhỏ hơn", c: "Learning rate giảm", d: "Không ảnh hưởng"}
        answer: b
        explanation: "C = 1/λ."
      - id: t08
        topic: advanced optimization
        lesson: 02_from_scratch_and_optimization.ipynb
        type: tf
        question: "BFGS/L-BFGS cần người dùng chọn learning rate giống gradient descent."
        answer: false
        explanation: "Có line search bên trong."
      - id: t09
        topic: feature mapping
        lesson: 03_regularized_logistic_regression.ipynb
        type: mcq
        question: "Muốn Logistic Regression có decision boundary hình tròn trên dữ liệu 2D, cần làm gì?"
        options: {a: "Tăng số vòng lặp", b: "Thêm feature x1², x2² (feature mapping)", c: "Giảm C", d: "Dùng softmax"}
        answer: b
        explanation: "Ranh giới tuyến tính trong không gian feature mới = đường tròn trong không gian gốc."
      - id: t10
        topic: regularization & boundary
        lesson: 03_regularized_logistic_regression.ipynb
        type: mcq
        question: "Feature mapping bậc 6 với λ ≈ 0 thường dẫn tới:"
        options: {a: "Underfit", b: "Overfit — ranh giới uốn éo bám theo từng điểm", c: "Model không train được", d: "Accuracy train thấp"}
        answer: b
        explanation: "28 feature, không phạt → overfit."
      - id: t11
        topic: One-vs-All
        lesson: 05_one_vs_all.ipynb
        type: tf
        question: "Trong One-vs-All, tổng các xác suất của K classifier luôn bằng 1."
        answer: false
        explanation: "Các classifier được train độc lập."
      - id: t12
        topic: softmax
        lesson: 06_softmax_regression.ipynb
        type: mcq
        question: "Softmax Regression với 2 lớp tương đương với:"
        options: {a: "One-vs-All", b: "Logistic Regression (sigmoid của hiệu hai logit)", c: "Linear Regression", d: "KNN"}
        answer: b
        explanation: "a1 = σ(z1 − z0)."
      - id: t13
        topic: softmax stability
        lesson: 06_softmax_regression.ipynb
        type: mcq
        question: "Vì sao trừ max(z) trước khi tính softmax?"
        options: {a: "Để tổng bằng 1", b: "Tránh tràn số khi exp; kết quả không đổi", c: "Làm model chính xác hơn", d: "Để xác suất lớp đúng tăng"}
        answer: b
        explanation: "e^(z−c)/Σe^(z−c) = e^z/Σe^z."
      - id: t14
        topic: decision threshold
        lesson: 07_threshold_and_failure_cases.ipynb
        type: mcq
        question: "Sàng lọc ung thư: bỏ sót người bệnh tốn kém hơn nhiều so với báo động nhầm. Nên chọn ngưỡng:"
        options: {a: "Cao hơn 0.5", b: "Thấp hơn 0.5", c: "Đúng 0.5", d: "Ngưỡng không ảnh hưởng"}
        answer: b
        explanation: "Ngưỡng thấp → recall cao."
      - id: t15
        topic: perfect separation
        lesson: 07_threshold_and_failure_cases.ipynb
        type: mcq
        question: "Dữ liệu tách được hoàn toàn và không regularization. Điều gì xảy ra với trọng số?"
        options: {a: "Hội tụ về 0", b: "Tiến ra vô cùng, GD không hội tụ", c: "Bằng nghiệm của Linear Regression", d: "Không thay đổi"}
        answer: b
        explanation: "Phóng to ‖w‖ luôn làm giảm cross-entropy."
      - id: t16
        topic: class imbalance
        lesson: 07_threshold_and_failure_cases.ipynb
        type: multi
        question: "Với dữ liệu 1% gian lận, cách nào giúp Logistic Regression phát hiện gian lận tốt hơn?"
        options:
          a: "class_weight='balanced'"
          b: "Hạ ngưỡng quyết định"
          c: "Đánh giá bằng precision/recall thay vì accuracy"
          d: "Bỏ hết feature số"
        answer: abc
        explanation: "Chương 14, 19 học kỹ hơn."
      - id: t17
        topic: linear ceiling
        lesson: 08_linear_classifiers_cifar10.ipynb
        type: mcq
        question: "Trên CIFAR-10, One-vs-All logistic, softmax và SVM đa lớp đều đạt khoảng 40% test. Kết luận đúng nhất:"
        options: {a: "Giới hạn nằm ở mô hình tuyến tính trên pixel thô, không phải ở hàm mất mát", b: "Cần tinh chỉnh learning rate kỹ hơn", c: "Dữ liệu CIFAR-10 bị lỗi", d: "Softmax luôn tốt nhất"}
        answer: a
        explanation: "Đổi loss không đổi kết quả → nút thắt là mô hình (một ảnh mẫu mỗi lớp)."
      - id: t18
        topic: mean image
        lesson: 08_linear_classifiers_cifar10.ipynb
        type: tf
        question: "Ảnh trung bình dùng để chuẩn hoá nên được tính trên cả train lẫn test để ước lượng chính xác hơn."
        answer: false
        explanation: "Tính trên test là rò rỉ thông tin; thống kê tiền xử lý chỉ được 'fit' trên train."
      - id: t19
        topic: learning curve high bias
        lesson: 08_linear_classifiers_cifar10.ipynb
        type: mcq
        question: "Learning curve cho accuracy train ≈ validation ≈ 40% khi tăng dữ liệu. Nên làm gì?"
        options: {a: "Đổi sang mô hình/đặc trưng mạnh hơn (vd CNN)", b: "Thu thêm thật nhiều dữ liệu", c: "Tăng regularization", d: "Giảm learning rate"}
        answer: a
        explanation: "Hai đường hội tụ ở mức thấp = high bias: thêm dữ liệu gần như vô ích."
  math:
    questions:
      - id: m01
        topic: sigmoid
        lesson: 01_logistic_regression.ipynb
        type: numeric
        decimals: 3
        question: "σ(2) = 1/(1 + e^(−2)) = ?"
        answer: 0.8808
        explanation: "≈ 0.881."
      - id: m02
        topic: decision boundary
        lesson: 01_logistic_regression.ipynb
        type: numeric
        decimals: 2
        question: "θ = [−6, 2, 1] (bias, x1, x2). Với x1 = 2, giá trị x2 trên decision boundary là?"
        answer: 2
        explanation: "−6 + 4 + x2 = 0 → x2 = 2."
      - id: m03
        topic: cross-entropy
        lesson: 01_logistic_regression.ipynb
        type: numeric
        decimals: 3
        question: "Một mẫu nhãn y = 1, model dự đoán h = 0.25. Loss −log(h) = ?"
        answer: 1.3863
        explanation: "−ln 0.25 = ln 4 ≈ 1.386."
      - id: m04
        topic: odds
        lesson: 01_logistic_regression.ipynb
        type: numeric
        decimals: 2
        question: "P(y=1) = 0.8. Odds = ?"
        answer: 4
        explanation: "0.8/0.2 = 4."
      - id: m05
        topic: softmax
        lesson: 06_softmax_regression.ipynb
        type: numeric
        decimals: 3
        question: "Logits z = [0, ln 3] (2 lớp). Xác suất lớp thứ hai theo softmax?"
        answer: 0.75
        explanation: "3/(1 + 3) = 0.75."
      - id: m06
        topic: optimal threshold
        lesson: 07_threshold_and_failure_cases.ipynb
        type: numeric
        decimals: 2
        question: "C_FP = 1, C_FN = 4, xác suất calibrated. Ngưỡng tối ưu C_FP/(C_FP + C_FN) = ?"
        answer: 0.2
        explanation: "1/5 = 0.2."
      - id: m07
        topic: số tham số
        lesson: 06_softmax_regression.ipynb
        type: numeric
        decimals: 0
        question: "Softmax Regression cho ảnh 28×28 (784 pixel) và 10 lớp có bao nhiêu tham số (kể cả bias)?"
        answer: 7850
        explanation: "784 × 10 + 10 = 7 850."
      - id: m08
        topic: multiclass svm loss
        lesson: 08_linear_classifiers_cifar10.ipynb
        type: numeric
        question: "Điểm của một ảnh: lớp đúng 2.0, hai lớp còn lại 2.5 và 0.5. SVM loss đa lớp với Δ = 1 bằng?"
        decimals: 2
        answer: 1.5
        explanation: "max(0, 2.5 − 2 + 1) + max(0, 0.5 − 2 + 1) = 1.5 + 0."
coding:
  tasks:
    - id: c01
      title: Cost và gradient của Logistic Regression
      prompt: |
        Viết `logistic_cost_grad(theta, X, y)` (X đã có cột bias) trả về `(J, grad)` với
        $J = -\frac1m[y^\top\log h + (1-y)^\top\log(1-h)]$ (clip $h$ vào $[10^{-15}, 1 - 10^{-15}]$), $\nabla J = \frac1m X^\top(h - y)$.
      code: |
        def logistic_cost_grad(theta, X, y):
            ### START CODE HERE ### (≈ 3 dòng)
            h = np.clip(1 / (1 + np.exp(-(X @ theta))), 1e-15, 1 - 1e-15)
            J = -np.mean(y * np.log(h) + (1 - y) * np.log(1 - h))
            grad = X.T @ (h - y) / len(y)
            ### END CODE HERE ###
            return J, grad
      tests: |
        from ml_course.utils import numerical_gradient, relative_error
        rng = np.random.default_rng(4)
        X = np.c_[np.ones(40), rng.normal(size=(40, 3))]
        y = rng.integers(0, 2, 40).astype(float)
        J0, _ = logistic_cost_grad(np.zeros(4), X, y)
        check_close(J0, np.log(2), message="J(0) = ln 2")
        t = rng.normal(size=4)
        num = numerical_gradient(lambda th: logistic_cost_grad(th, X, y)[0], t.copy())
        check_less(relative_error(logistic_cost_grad(t, X, y)[1], num), 1e-6, "gradient check")
    - id: c02
      title: Softmax ổn định số học
      prompt: |
        Viết `softmax_rows(Z)` — softmax theo từng hàng, trừ max mỗi hàng trước khi `exp`.
      code: |
        def softmax_rows(Z):
            ### START CODE HERE ### (≈ 2 dòng)
            E = np.exp(Z - Z.max(axis=1, keepdims=True))
            P = E / E.sum(axis=1, keepdims=True)
            ### END CODE HERE ###
            return P
      tests: |
        P = softmax_rows(np.array([[1.0, 2.0, 3.0], [1000.0, 1000.0, 1000.0], [0.0, np.log(3), -50.0]]))
        check_close(P.sum(axis=1), [1, 1, 1], message="mỗi hàng tổng = 1")
        check_close(P[1], [1/3, 1/3, 1/3], message="ổn định với giá trị lớn")
        check_close(P[2, :2], [0.25, 0.75], tol=1e-9, message="softmax([0, ln3, ...])")
analysis:
  prompt: |
    Một model Logistic Regression dự đoán khách hàng vỡ nợ, train trên dữ liệu có 3% vỡ nợ. Báo cáo: accuracy 97.2%, hệ số của `income` = −0.8 (feature đã chuẩn hoá), dùng ngưỡng 0.5, `C=1e6`.
    Một trong các feature là `days_past_due_next_month` có hệ số rất lớn.
    Hãy đánh giá báo cáo này: những điểm nào đáng lo ngại và bạn sẽ đề xuất gì?
  rubric:
    - "Chỉ ra accuracy 97.2% gần như bằng baseline 'luôn đoán không vỡ nợ' (97%) → cần precision/recall/ROC-AUC/PR-AUC"
    - "Chỉ ra days_past_due_next_month là thông tin tương lai → target leakage"
    - "Đề xuất chọn ngưỡng theo chi phí FP/FN thay vì 0.5 (và/hoặc class_weight)"
    - "Nhận xét C=1e6 gần như không regularization → nguy cơ hệ số không ổn định/quá lớn, đề xuất chọn C bằng CV"
    - "Diễn giải đúng hệ số income: tăng 1 độ lệch chuẩn thu nhập → odds vỡ nợ nhân e^(−0.8) ≈ 0.45 (không phải xác suất giảm 0.8)"
  sample_answer: |
    (1) Accuracy 97.2% gần bằng mô hình "luôn đoán không vỡ nợ" (97%) — vô nghĩa; cần precision, recall, PR-AUC, ROC-AUC.
    (2) `days_past_due_next_month` là dữ liệu của tháng SAU thời điểm dự đoán → target leakage; phải loại bỏ, đánh giá lại.
    (3) Ngưỡng 0.5 không phù hợp với dữ liệu mất cân bằng và chi phí bất đối xứng (bỏ sót vỡ nợ đắt hơn) → chọn ngưỡng theo chi phí trên validation, cân nhắc class_weight.
    (4) C = 1e6 gần như không regularization → hệ số có thể không ổn định; chọn C bằng CV.
    (5) Hệ số income −0.8: tăng 1 độ lệch chuẩn thu nhập thì odds vỡ nợ nhân e^-0.8 ≈ 0.45 (giữ các feature khác cố định) — liên hệ, không phải nhân quả.
project:
  prompt: |
    **Mini project — Phân loại 10 chữ số với Softmax Regression from scratch.** Dùng `load_digits_data()` (X đã chia 16),
    chia train/test 75/25 (`random_state=0`, `stratify=y`). Cài đặt và train Softmax Regression (có L2) bằng gradient descent
    **không dùng sklearn cho model**. Đạt **accuracy test ≥ 0.95** (biến `test_acc`).
  code: |
    from sklearn.model_selection import train_test_split
    from ml_course.datasets import load_digits_data

    X, y, _ = load_digits_data()
    X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, random_state=0, stratify=y)
    ### START CODE HERE ### (≈ 12 dòng)
    C = 10
    Y = np.eye(C)[y_tr]
    W, b = np.zeros((X.shape[1], C)), np.zeros(C)
    lr, lam, m = 0.5, 1.0, len(X_tr)
    for _ in range(500):
        Z = X_tr @ W + b
        E = np.exp(Z - Z.max(axis=1, keepdims=True))
        A = E / E.sum(axis=1, keepdims=True)
        dZ = (A - Y) / m
        W -= lr * (X_tr.T @ dZ + lam / m * W)
        b -= lr * dZ.sum(axis=0)
    test_acc = np.mean(np.argmax(X_te @ W + b, axis=1) == y_te)
    ### END CODE HERE ###
    print("accuracy test:", test_acc)
  tests: |
    check_greater(test_acc, 0.949, "accuracy test ≥ 0.95")
