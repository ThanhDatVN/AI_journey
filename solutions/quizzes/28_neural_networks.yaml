coding:
  tasks:
    - id: c01
      title: Hàm kích hoạt và đạo hàm
      prompt: |
        Viết `leaky_relu(x, alpha)` và `leaky_relu_grad(x, alpha)` (vector hoá, không vòng lặp).
      code: |
        def leaky_relu(x, alpha=0.01):
            ### START CODE HERE ### (≈ 1 dòng)
            return np.where(x > 0, x, alpha * x)
            ### END CODE HERE ###

        def leaky_relu_grad(x, alpha=0.01):
            ### START CODE HERE ### (≈ 1 dòng)
            return np.where(x > 0, 1.0, alpha)
            ### END CODE HERE ###
      tests: |
        x = np.array([-2.0, -0.5, 0.5, 3.0])
        check_close(leaky_relu(x, 0.1), [-0.2, -0.05, 0.5, 3.0], message="leaky ReLU")
        num = (leaky_relu(x + 1e-6, 0.1) - leaky_relu(x - 1e-6, 0.1)) / 2e-6
        check_close(leaky_relu_grad(x, 0.1), num, tol=1e-6, message="đạo hàm khớp sai phân hữu hạn")
    - id: c02
      title: Một bước Adam
      prompt: |
        Viết `adam_step(theta, g, m, s, t, lr, b1=0.9, b2=0.999, eps=1e-8)` trả về `(theta_new, m_new, s_new)` (có hiệu chỉnh bias, t bắt đầu từ 1).
      code: |
        def adam_step(theta, g, m, s, t, lr, b1=0.9, b2=0.999, eps=1e-8):
            ### START CODE HERE ### (≈ 5 dòng)
            m = b1 * m + (1 - b1) * g
            s = b2 * s + (1 - b2) * g**2
            m_hat, s_hat = m / (1 - b1**t), s / (1 - b2**t)
            theta = theta - lr * m_hat / (np.sqrt(s_hat) + eps)
            ### END CODE HERE ###
            return theta, m, s
      tests: |
        th, m, s = adam_step(np.array([1.0]), np.array([2.0]), np.zeros(1), np.zeros(1), 1, 0.1, eps=0.0)
        check_close(th, [0.9], message="bước đầu có độ lớn η")
        th2, _, _ = adam_step(th, np.array([-1.0]), m, s, 2, 0.1, eps=0.0)
        check_close(th2, [0.8734], tol=1e-4, message="bước thứ hai")
analysis:
  prompt: |
    Một nhóm huấn luyện MLP 12 lớp cho dữ liệu cảm biến (200 feature, 5 000 mẫu, 4 lớp). Hiện tượng: (1) loss đứng yên ở ln 4 với sigmoid +
    khởi tạo N(0, 1); (2) đổi sang ReLU thì loss giảm vài epoch rồi đột ngột thành NaN với SGD lr 0.5; (3) sau khi giảm lr, train accuracy 99%,
    val 78%; (4) thêm BatchNorm nhưng khi triển khai, dự đoán từng mẫu một cho kết quả khác hẳn lúc đánh giá theo batch; (5) tăng batch size từ
    32 lên 1024 để tận dụng GPU, accuracy giảm. Chẩn đoán và đề xuất cho từng hiện tượng.
  rubric:
    - "Hiện tượng 1: sigmoid + N(0,1) → bão hoà, vanishing gradient qua 12 lớp; dùng ReLU/GELU + He init, chuẩn hoá đầu vào"
    - "Hiện tượng 2: LR quá lớn → bùng nổ/NaN; LR range test, Adam(W), gradient clipping, warmup"
    - "Hiện tượng 3: overfitting → weight decay, dropout, early stopping, augmentation/thêm dữ liệu, mô hình nhỏ hơn"
    - "Hiện tượng 4: quên model.eval() khi triển khai → BN dùng thống kê của batch (batch 1) thay vì running stats"
    - "Hiện tượng 5: batch lớn với cùng LR/epoch → ít bước, underfit; tăng LR theo tỉ lệ + warmup, hoặc train thêm"
  sample_answer: |
    (1) Sigmoid bão hoà với trọng số N(0,1) (tiền kích hoạt lớn), đạo hàm ≤ 0.25 nhân qua 12 lớp → gradient lớp đầu ≈ 0, mạng đoán đều 4 lớp (ln 4).
    Dùng ReLU/GELU + He init, chuẩn hoá đầu vào. (2) ReLU không bão hoà nhưng lr 0.5 quá lớn → bùng nổ → NaN; chọn lr bằng LR range test,
    dùng AdamW, gradient clipping, warmup. (3) Train 99%/val 78% → overfitting: weight decay, dropout, early stopping, thêm dữ liệu/augmentation,
    giảm kích thước. (4) Dự đoán từng mẫu khác batch → quên model.eval(): BN dùng thống kê của chính batch; phải eval() để dùng running mean/var.
    (5) Batch 1024 với cùng lr/epoch → số bước giảm 32 lần → underfit; tăng lr theo tỉ lệ tuyến tính kèm warmup hoặc train lâu hơn.
project:
  prompt: |
    **Mini project — Huấn luyện mạng SÂU cho chữ số.** `load_digits()`, chia train/test 75/25 (`random_state=0`, stratify), chuẩn hoá theo train.
    Mạng phải có **ít nhất 6 lớp ẩn** (`n_hidden_layers`) và đạt accuracy test `test_acc` ≥ 0.95. Dùng những gì đã học (khởi tạo, chuẩn hoá,
    optimizer phù hợp).
  code: |
    import torch
    from torch import nn
    from sklearn.datasets import load_digits
    from sklearn.model_selection import train_test_split
    from sklearn.preprocessing import StandardScaler

    X, y = load_digits(return_X_y=True)
    X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, random_state=0, stratify=y)
    sc = StandardScaler().fit(X_tr)
    Xt, Xe = (torch.tensor(sc.transform(a), dtype=torch.float32) for a in (X_tr, X_te))
    yt, ye = torch.tensor(y_tr), torch.tensor(y_te)
    torch.manual_seed(0)
    ### START CODE HERE ### (≈ 20 dòng)
    layers, d, width = [], 64, 128
    n_hidden_layers = 6
    for _ in range(n_hidden_layers):
        lin = nn.Linear(d, width)
        nn.init.kaiming_normal_(lin.weight, nonlinearity="relu")      # He init cho ReLU
        layers += [lin, nn.BatchNorm1d(width), nn.ReLU()]              # BN giữ phân phối ổn định qua 6 lớp
        d = width
    model = nn.Sequential(*layers, nn.Linear(d, 10))
    epochs, batch = 40, 32
    opt = torch.optim.AdamW(model.parameters(), lr=3e-3, weight_decay=1e-4)
    sched = torch.optim.lr_scheduler.OneCycleLR(opt, max_lr=3e-3, epochs=epochs, steps_per_epoch=-(-len(Xt) // batch))
    for epoch in range(epochs):
        model.train()
        perm = torch.randperm(len(Xt))
        for s in range(0, len(perm), batch):
            idx = perm[s:s + batch]
            opt.zero_grad()
            nn.functional.cross_entropy(model(Xt[idx]), yt[idx]).backward()
            opt.step()
            sched.step()                                               # OneCycle: cập nhật LR sau mỗi bước
    model.eval()
    with torch.no_grad():
        test_acc = (model(Xe).argmax(1) == ye).float().mean().item()
    ### END CODE HERE ###
    print(f"{n_hidden_layers} lớp ẩn | accuracy test = {test_acc:.4f}")
  tests: |
    check_true(n_hidden_layers >= 6, "≥ 6 lớp ẩn")
    check_greater(test_acc, 0.95, "accuracy test ≥ 0.95")
