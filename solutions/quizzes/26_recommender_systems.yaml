      - id: m01
        topic: damped mean
        lesson: 01_popularity_and_content_based.ipynb
        type: numeric
        decimals: 3
        question: "μ = 3.5, m = 5. Phim có 5 rating, trung bình 4.5. Trung bình giảm chấn = ?"
