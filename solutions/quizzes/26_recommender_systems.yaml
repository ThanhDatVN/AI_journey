title: "26 · Recommender Systems"
sections:
  theory:
    questions:
      - id: t01
        topic: feedback types
        lesson: 01_popularity_and_content_based.ipynb
        type: multi
        question: "Ví dụ nào là phản hồi NGẦM (implicit)?"
        options: {a: "Lượt xem phim", b: "Thời gian đọc bài", c: "Rating 4 sao", d: "Thêm vào giỏ hàng"}
        answer: abd
        explanation: "Rating là phản hồi tường minh."
      - id: t02
        topic: damped mean
        lesson: 01_popularity_and_content_based.ipynb
        type: mcq
        question: "Vì sao xếp phim theo trung bình rating thô là tồi?"
        options:
          a: "Phim có 1–2 rating cao ngẫu nhiên lên đầu bảng; cần giảm chấn về trung bình chung"
          b: "Vì trung bình luôn thấp"
          c: "Vì không tính được"
          d: "Vì rating là số nguyên"
        answer: a
        explanation: "Bayesian average: (Σr + mμ)/(n + m)."
      - id: t03
        topic: content-based
        lesson: 01_popularity_and_content_based.ipynb
        type: mcq
        question: "Content-based xử lý được loại cold start nào?"
        options: {a: "Item mới (chỉ cần đặc trưng nội dung)", b: "User mới chưa có lịch sử", c: "Cả hai", d: "Không loại nào"}
        answer: a
        explanation: "User mới chưa có hồ sơ sở thích."
      - id: t04
        topic: popularity baseline
        lesson: 01_popularity_and_content_based.ipynb
        type: tf
        question: "Trong đánh giá offline top-N, gợi ý theo độ phổ biến thường là baseline khó đánh bại."
        answer: true
        explanation: "Item phổ biến là item hay được tương tác — và xuất hiện trong test."
      - id: t05
        topic: bias model
        lesson: 02_collaborative_filtering.ipynb
        type: mcq
        question: "Baseline predictor μ + b_u + b_i bắt được:"
        options: {a: "User chấm dễ/khó và item hay/dở hơn mặt bằng", b: "Tương tác gu user–item", c: "Thể loại phim", d: "Thời gian"}
        answer: a
        explanation: "Phần cá nhân hoá (tương tác) do KNN/MF học."
      - id: t06
        topic: similarity
        lesson: 02_collaborative_filtering.ipynb
        type: multi
        question: "Cải tiến độ tương đồng item–item trong CF dựa trên rating:"
        options:
          a: "Tính trên phần dư sau khi trừ thiên lệch (≈ Pearson)"
          b: "Shrinkage theo số user chung"
          c: "Dùng rating thô kể cả ô trống bằng 0 coi như ghét"
          d: "Chỉ giữ top-k láng giềng"
        answer: abd
        explanation: "Ô trống không phải rating 0."
      - id: t07
        topic: item vs user
        lesson: 02_collaborative_filtering.ipynb
        type: mcq
        question: "Vì sao item-based CF phổ biến trong production?"
        options:
          a: "Quan hệ giữa item ổn định hơn user, tính trước ma trận tương tự offline và tra cứu nhanh"
          b: "Luôn chính xác hơn"
          c: "Không cần dữ liệu"
          d: "Xử lý được item mới"
        answer: a
        explanation: "Linden et al. (2003)."
      - id: t08
        topic: MF objective
        lesson: 03_matrix_factorization.ipynb
        type: mcq
        question: "Vì sao không áp dụng thẳng SVD cho ma trận rating?"
        options:
          a: "Phần lớn ô trống; điền 0 coi 'chưa xem' như 'rating rất thấp' — phải tối ưu chỉ trên ô quan sát"
          b: "SVD quá chậm với 200 item"
          c: "SVD chỉ dùng cho ảnh"
          d: "SVD không cho ma trận hạng thấp"
        answer: a
        explanation: "Funk SVD/ALS tối ưu trên tập ô quan sát."
      - id: t09
        topic: ALS
        lesson: 03_matrix_factorization.ipynb
        type: mcq
        question: "Trong ALS, khi cố định Q, mỗi vector user p_u được tìm bằng:"
        options: {a: "Một bài toán Ridge nghiệm đóng, độc lập với user khác", b: "Gradient descent nhiều vòng", c: "K-Means", d: "SVD đầy đủ"}
        answer: a
        explanation: "Dễ song song hoá."
      - id: t10
        topic: overfitting
        lesson: 03_matrix_factorization.ipynb
        type: tf
        question: "Với λ nhỏ, RMSE test của MF có thể tăng trở lại khi train thêm epoch dù RMSE train vẫn giảm."
        answer: true
        explanation: "Early stopping/regularization."
      - id: t11
        topic: PureSVD
        lesson: 03_matrix_factorization.ipynb
        type: mcq
        question: "PureSVD cho top-N phân rã ma trận nào?"
        options: {a: "Ma trận nhị phân đã xem / chưa xem", b: "Ma trận rating đã điền trung bình", c: "Ma trận tương đồng item", d: "Ma trận đặc trưng nội dung"}
        answer: a
        explanation: "Ở phản hồi ngầm, 0 đúng nghĩa 'chưa tương tác'."
      - id: t12
        topic: NDCG
        lesson: 04_ranking_metrics.ipynb
        type: mcq
        question: "Ưu điểm của NDCG so với precision@k:"
        options: {a: "Nhạy với thứ tự và hỗ trợ nhiều mức liên quan", b: "Không cần dữ liệu test", c: "Luôn lớn hơn", d: "Không phụ thuộc k"}
        answer: a
        explanation: "Item liên quan ở vị trí đầu được thưởng nhiều hơn."
      - id: t13
        topic: RMSE vs ranking
        lesson: 04_ranking_metrics.ipynb
        type: mcq
        question: "MF có RMSE tốt nhất nhưng precision@10 kém popularity. Nguyên nhân chính:"
        options:
          a: "Dữ liệu thiếu không ngẫu nhiên: RMSE đo trên phim user đã chọn, còn xếp hạng mọi phim đẩy lên phim user không chọn"
          b: "Do bug trong code"
          c: "Vì MF không dùng thiên lệch"
          d: "Vì precision@10 luôn thấp"
        answer: a
        explanation: "Học đúng câu hỏi: phản hồi ngầm/BPR cho top-N."
      - id: t14
        topic: beyond accuracy
        lesson: 04_ranking_metrics.ipynb
        type: multi
        question: "Metric nào đo khía cạnh NGOÀI độ chính xác?"
        options: {a: "Coverage", b: "Novelty", c: "Intra-list diversity", d: "Recall@k"}
        answer: abc
        explanation: "Recall@k là metric độ chính xác."
      - id: t15
        topic: MMR
        lesson: 04_ranking_metrics.ipynb
        type: mcq
        question: "MMR re-ranking cân bằng:"
        options: {a: "Độ phù hợp và độ khác biệt với các item đã chọn", b: "Thời gian train và test", c: "RMSE và MAE", d: "Số user và số item"}
        answer: a
        explanation: "λ·relevance − (1 − λ)·max similarity."
      - id: t16
        topic: feedback loop
        lesson: 04_ranking_metrics.ipynb
        type: tf
        question: "Huấn luyện lại hệ gợi ý chỉ trên tương tác với những gì nó đã gợi ý có thể khuếch đại thiên lệch phổ biến."
        answer: true
        explanation: "Vòng phản hồi — cần exploration, theo dõi độ phủ."
  math:
