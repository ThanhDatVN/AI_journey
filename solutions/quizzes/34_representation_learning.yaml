title: "34 · Representation Learning"
sections:
  theory:
    questions:
      - id: t01
        topic: autoencoder
        lesson: 01_autoencoders.ipynb
        type: mcq
        question: "Autoencoder học biểu diễn bằng cách:"
        options: {a: "Nén đầu vào qua nút cổ chai rồi tái tạo lại chính nó — không cần nhãn", b: "Dự đoán nhãn lớp", c: "Phân cụm dữ liệu", d: "Sinh dữ liệu đối kháng"}
        answer: a
        explanation: "Dữ liệu tự làm đáp án."
      - id: t02
        topic: linear ae pca
        lesson: 01_autoencoders.ipynb
        type: tf
        question: "Autoencoder tuyến tính với loss MSE học được không gian con giống (hoặc gần giống) PCA cùng số chiều."
        answer: true
        explanation: "Baldi & Hornik (1989); trục có thể khác."
      - id: t03
        topic: what latent encodes
        lesson: 01_autoencoders.ipynb
        type: mcq
        question: "Latent của autoencoder train trên ảnh hình học mã hoá tốt vị trí/kích thước nhưng kém loại hình vì:"
        options: {a: "Sai số tái tạo pixel bị chi phối bởi việc đặt đúng chỗ một vùng sáng đúng cỡ; khác biệt loại hình chỉ ảnh hưởng ít pixel", b: "Latent quá nhỏ", c: "Thiếu nhãn", d: "Dùng ReLU"}
        answer: a
        explanation: "Biểu diễn phản ánh mục tiêu huấn luyện."
      - id: t04
        topic: denoising
        lesson: 01_autoencoders.ipynb
        type: mcq
        question: "Denoising autoencoder được huấn luyện với:"
        options: {a: "Đầu vào bị nhiễu, đích là ảnh sạch", b: "Đầu vào sạch, đích bị nhiễu", c: "Cả hai bị nhiễu", d: "Nhãn lớp"}
        answer: a
        explanation: "Ý tưởng nền tảng của diffusion."
      - id: t05
        topic: anomaly
        lesson: 01_autoencoders.ipynb
        type: tf
        question: "Sai số tái tạo của autoencoder luôn là điểm bất thường tốt, vì autoencoder không tái tạo được dữ liệu chưa từng thấy."
        answer: false
        explanation: "AE tổng quát hoá — có thể tái tạo tốt cả bất thường."
      - id: t06
        topic: ae sampling
        lesson: 02_variational_autoencoder.ipynb
        type: mcq
        question: "Giải mã z ~ N(0, I) bằng decoder của autoencoder thường ra ảnh vô nghĩa vì:"
        options: {a: "Không có ràng buộc nào về vị trí/phân phối latent của dữ liệu", b: "Decoder quá nhỏ", c: "Thiếu dữ liệu", d: "Ảnh xám"}
        answer: a
        explanation: "VAE thêm KL về prior."
      - id: t07
        topic: elbo
        lesson: 02_variational_autoencoder.ipynb
        type: multi
        question: "Về ELBO của VAE:"
        options:
          a: "Là cận dưới của log p(x)"
          b: "Gồm số hạng tái tạo và số hạng KL giữa q(z|x) và prior"
          c: "KL với Gaussian chuẩn có công thức đóng"
          d: "Tối đa ELBO tương đương tối thiểu accuracy"
        answer: abc
        explanation: "−ELBO là loss."
      - id: t08
        topic: reparam
        lesson: 02_variational_autoencoder.ipynb
        type: mcq
        question: "Reparameterization trick viết z = μ + σ·ε để:"
        options: {a: "Gradient lan truyền được qua μ, σ dù z được lấy mẫu ngẫu nhiên", b: "Giảm số tham số", c: "Làm z luôn dương", d: "Bỏ số hạng KL"}
        answer: a
        explanation: "Tính ngẫu nhiên nằm ở ε."
      - id: t09
        topic: beta
        lesson: 02_variational_autoencoder.ipynb
        type: mcq
        question: "Tăng β trong β-VAE thường dẫn tới:"
        options: {a: "KL nhỏ hơn, tái tạo kém hơn, ít chiều latent được dùng, mẫu mờ hơn", b: "Tái tạo sắc hơn", c: "KL lớn hơn", d: "Không ảnh hưởng"}
        answer: a
        explanation: "Đánh đổi rate–distortion."
      - id: t10
        topic: generative eval
        lesson: 02_variational_autoencoder.ipynb
        type: tf
        question: "Nếu một bộ phân loại tiền huấn luyện dự đoán mẫu sinh với độ tự tin cao thì chắc chắn mẫu sinh có chất lượng tốt."
        answer: false
        explanation: "Bộ phân loại tự tin cả với nhiễu xám."
      - id: t11
        topic: diffusion
        lesson: 02_variational_autoencoder.ipynb
        type: mcq
        question: "Mô hình diffusion sinh ảnh bằng cách:"
        options: {a: "Học khử nhiễu và khử nhiễu dần từ nhiễu thuần", b: "Đối kháng với discriminator", c: "Sinh từng pixel theo thứ tự", d: "Phân cụm ảnh"}
        answer: a
        explanation: "≈ denoising AE nhiều mức nhiễu."
      - id: t12
        topic: simclr
        lesson: 03_contrastive_and_self_supervised.ipynb
        type: mcq
        question: "Trong SimCLR, cặp dương là:"
        options: {a: "Hai góc nhìn tăng cường của cùng một ảnh", b: "Hai ảnh cùng lớp (theo nhãn)", c: "Ảnh và nhãn của nó", d: "Hai ảnh ngẫu nhiên"}
        answer: a
        explanation: "Không cần nhãn."
      - id: t13
        topic: augmentation role
        lesson: 03_contrastive_and_self_supervised.ipynb
        type: mcq
        question: "Bỏ augmentation hình học khỏi SimCLR làm biểu diễn kém đi vì:"
        options: {a: "Hai góc nhìn khớp được bằng vị trí/kích thước, nên biểu diễn không cần bất biến với chúng", b: "Loss không hội tụ", c: "Batch quá nhỏ", d: "Mạng quá sâu"}
        answer: a
        explanation: "Augmentation định nghĩa bất biến."
      - id: t14
        topic: loss vs quality
        lesson: 03_contrastive_and_self_supervised.ipynb
        type: tf
        question: "Loss contrastive thấp hơn luôn có nghĩa biểu diễn tốt hơn cho tác vụ đích."
        answer: false
        explanation: "Bản không aug hình học có loss thấp hơn nhưng probe kém hơn."
      - id: t15
        topic: collapse
        lesson: 03_contrastive_and_self_supervised.ipynb
        type: multi
        question: "Cách các phương pháp tự giám sát tránh sụp đổ biểu diễn:"
        options: {a: "Dùng mẫu âm (SimCLR, MoCo)", b: "Bất đối xứng + dừng gradient / giáo viên trung bình động (BYOL, SimSiam)", c: "Ràng buộc phương sai/hiệp phương sai (VICReg)", d: "Tăng learning rate"}
        answer: abc
        explanation: "Nghiệm tầm thường: mọi ảnh cùng vector."
      - id: t16
        topic: clip
        lesson: 03_contrastive_and_self_supervised.ipynb
        type: mcq
        question: "CLIP học bằng:"
        options: {a: "Học tương phản giữa ảnh và văn bản mô tả trên hàng trăm triệu cặp", b: "Tái tạo pixel", c: "Phân loại ImageNet", d: "Phân cụm k-means"}
        answer: a
        explanation: "Cho phép phân loại zero-shot."
