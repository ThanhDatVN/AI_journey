    questions:
      - id: t01
        topic: rl vs supervised
        lesson: 01_mdp_and_bellman.ipynb
        type: multi
        question: "Điểm khác biệt của học tăng cường so với học có giám sát:"
        options: {a: "Không có đáp án đúng cho từng bước, chỉ có phần thưởng (thường trễ)", b: "Dữ liệu phụ thuộc vào hành động của tác tử", c: "Phải cân bằng khám phá và khai thác", d: "Không cần hàm mục tiêu"}
        answer: abc
        explanation: "Mục tiêu là return."
      - id: t02
