        answer: a
        explanation: "Đổi lại TD có thiên lệch."
      - id: t08
        topic: bootstrapping
        lesson: 02_monte_carlo_and_td.ipynb
        type: tf
        question: "TD học được cả khi lượt chơi không bao giờ kết thúc, còn Monte Carlo thì không."
