        lesson: 01_mdp_and_bellman.ipynb
        type: mcq
        question: "UCB chọn cần gạt theo:"
        options: {a: "Giá trị ước lượng cộng một phần thưởng cho độ không chắc chắn (cần gạt ít được thử)", b: "Cần gạt ngẫu nhiên", c: "Cần gạt có giá trị ước lượng cao nhất", d: "Cần gạt được thử nhiều nhất"}
        answer: a
