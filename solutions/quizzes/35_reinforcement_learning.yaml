          a: "Chỉ cần đánh giá được fitness, không cần gradient"
          b: "Đột biến quá nhỏ dễ hội tụ sớm; quá lớn làm mất thông tin di truyền"
          c: "Song song hoá dễ vì các cá thể đánh giá độc lập"
          d: "Luôn đảm bảo tìm được lời giải tối ưu"
        answer: abc
        explanation: "GA không chứng minh tối ưu."
  math:
