        lesson: 04_dqn_and_policy_gradient.ipynb
        type: multi
        question: "Các thành phần giúp DQN ổn định hơn Q-learning với mạng nơ-ron ngây thơ:"
        options: {a: "Experience replay", b: "Target network", c: "Double DQN", d: "Bỏ hoàn toàn khám phá"}
        answer: abc
        explanation: "Khám phá vẫn cần."
      - id: t13
        topic: timeout
        lesson: 04_dqn_and_policy_gradient.ipynb
        type: tf
        question: "Khi lượt chơi dừng vì hết giờ (đạt số bước tối đa), mục tiêu TD vẫn nên bootstrap từ trạng thái kế tiếp."
        answer: true
        explanation: "Hết giờ không phải trạng thái kết thúc thật."
      - id: t14
        topic: baseline
        lesson: 04_dqn_and_policy_gradient.ipynb
        type: mcq
        question: "Baseline trong REINFORCE:"
        options: {a: "Giảm phương sai ước lượng gradient mà không làm lệch kỳ vọng", b: "Làm gradient thiên lệch để học nhanh hơn", c: "Thay thế hàm phần thưởng", d: "Chỉ dùng cho hành động liên tục"}
        answer: a
        explanation: "Advantage = G − V(s)."
      - id: t15
        topic: seeds
        lesson: 04_dqn_and_policy_gradient.ipynb
        type: tf
        question: "Kết quả deep RL trên một seed là đủ để kết luận thuật toán tốt hơn."
        answer: false
        explanation: "Cùng cấu hình, các seed DQN cho đường cong khác hẳn nhau."
      - id: t16
