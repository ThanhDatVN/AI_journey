        answer: a
        explanation: "Thưởng xa bị chiết khấu mạnh."
      - id: t07
        topic: td vs mc
        lesson: 02_monte_carlo_and_td.ipynb
        type: mcq
        question: "TD(0) thường hội tụ nhanh hơn Monte Carlo vì:"
