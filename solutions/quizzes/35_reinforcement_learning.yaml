        question: "Trên Cliff Walking với ε = 0.1 cố định, Q-learning có tổng thưởng khi đang học thấp hơn SARSA vì:"
        options: {a: "Nó học và đi đường tối ưu sát vực; khám phá ngẫu nhiên khiến thỉnh thoảng rơi xuống vực", b: "Nó học chậm hơn", c: "Nó không hội tụ", d: "Nó dùng γ khác"}
        answer: a
        explanation: "SARSA học giá trị của chính sách có khám phá nên tránh xa vực."
      - id: t10
        topic: off-policy
        lesson: 03_q_learning_and_sarsa.ipynb
        type: mcq
        question: "Off-policy nghĩa là:"
        options: {a: "Học giá trị của một chính sách (mục tiêu) từ dữ liệu sinh bởi chính sách khác (hành vi)", b: "Không dùng chính sách", c: "Chỉ học khi offline", d: "Không có phần thưởng"}
        answer: a
        explanation: "Q-learning, DQN là off-policy."
      - id: t11
        topic: max bias
        lesson: 03_q_learning_and_sarsa.ipynb
        type: mcq
        question: "Thiên lệch cực đại của Q-learning xuất phát từ:"
        options: {a: "Lấy max trên các ước lượng nhiễu → kỳ vọng của max ≥ max của kỳ vọng", b: "Learning rate quá nhỏ", c: "Thiếu khám phá", d: "Dùng γ < 1"}
        answer: a
