      - id: t03
        topic: bellman
        lesson: 01_mdp_and_bellman.ipynb
        type: tf
        question: "Với chính sách cố định và mô hình đã biết, phương trình Bellman kỳ vọng là một hệ phương trình tuyến tính có thể giải trực tiếp."
        answer: true
        explanation: "V = (I − γP^π)^(-1) R^π."
      - id: t04
        topic: vi vs pi
        lesson: 01_mdp_and_bellman.ipynb
        type: mcq
        question: "So với value iteration, policy iteration thường:"
        options: {a: "Cần rất ít vòng, nhưng mỗi vòng đắt hơn (đánh giá chính sách đầy đủ)", b: "Không hội tụ", c: "Cho kết quả khác", d: "Không cần mô hình"}
        answer: a
        explanation: "Cùng V*."
      - id: t05
        topic: slippery
        lesson: 01_mdp_and_bellman.ipynb
        type: mcq
        question: "Trên FrozenLake trơn, chính sách tối ưu có lúc hướng vào tường vì:"
        options: {a: "Đi vào tường thì các hướng trượt có thể xảy ra đều không dẫn xuống hố", b: "Lỗi thuật toán", c: "γ quá nhỏ", d: "Tường cho phần thưởng"}
        answer: a
