title: "29 · CNN"
sections:
  theory:
    questions:
      - id: t01
        topic: why conv
        lesson: 01_convolution_from_scratch.ipynb
        type: multi
        question: "Lợi thế của lớp tích chập so với lớp fully-connected trên ảnh:"
        options: {a: "Chia sẻ trọng số theo vị trí", b: "Kết nối cục bộ", c: "Số tham số không phụ thuộc kích thước ảnh", d: "Luôn bất biến với mọi phép biến đổi"}
        answer: abc
        explanation: "Conv chỉ đồng biến với phép dịch, không bất biến với xoay/co giãn."
      - id: t02
        topic: output size
        lesson: 01_convolution_from_scratch.ipynb
        type: mcq
        question: "Ảnh 32×32, kernel 5×5, stride 1, padding 2. Kích thước đầu ra?"
        options: {a: "32×32", b: "28×28", c: "30×30", d: "16×16"}
        answer: a
        explanation: "(32 + 4 − 5)/1 + 1 = 32 — padding 'same'."
      - id: t03
        topic: params
        lesson: 01_convolution_from_scratch.ipynb
        type: mcq
        question: "Số tham số của Conv2d(64, 128, kernel_size=3) (có bias):"
        options: {a: "73 856", b: "73 728", c: "1 152", d: "8 192"}
        answer: a
        explanation: "128·(64·9 + 1)."
      - id: t04
        topic: im2col
        lesson: 01_convolution_from_scratch.ipynb
        type: tf
        question: "Có thể biến tích chập thành một phép nhân ma trận lớn bằng cách trải các mảnh ảnh thành cột (im2col)."
        answer: true
        explanation: "GPU nhân ma trận rất nhanh."
      - id: t05
        topic: equivariance
        lesson: 01_convolution_from_scratch.ipynb
        type: mcq
        question: "Dịch ảnh đầu vào 3 pixel sang phải thì bản đồ đặc trưng của một lớp conv (stride 1):"
        options: {a: "Dịch theo 3 pixel sang phải (đồng biến)", b: "Không đổi", c: "Thay đổi ngẫu nhiên", d: "Bị lật"}
        answer: a
        explanation: "Bất biến cần pooling (toàn cục)."
      - id: t06
        topic: receptive field
        lesson: 01_convolution_from_scratch.ipynb
        type: mcq
        question: "Ba lớp conv 3×3 liên tiếp (stride 1) có trường tiếp nhận:"
        options: {a: "7×7", b: "9×9", c: "3×3", d: "27×27"}
        answer: a
        explanation: "1 + 3·2."
      - id: t07
        topic: gap vs flatten
        lesson: 02_cnn_with_pytorch.ipynb
        type: mcq
        question: "Train ở nửa trái ảnh, test ở nửa phải: mô hình nào tổng quát hoá tốt nhất?"
        options: {a: "CNN + global average pooling", b: "MLP", c: "CNN + flatten + Linear", d: "Như nhau"}
        answer: a
        explanation: "Conv đồng biến + GAP bất biến với vị trí."
      - id: t08
        topic: augmentation
        lesson: 02_cnn_with_pytorch.ipynb
        type: mcq
        question: "Augmentation hợp lệ phải:"
        options: {a: "Giữ nguyên nhãn", b: "Thay đổi nhãn", c: "Chỉ dùng cho test", d: "Luôn gồm lật dọc"}
        answer: a
        explanation: "Lật dọc '6' thành '9' là sai."
      - id: t09
        topic: features
        lesson: 02_cnn_with_pytorch.ipynb
        type: mcq
        question: "Bộ lọc ở lớp đầu của CNN thường học:"
        options: {a: "Bộ dò cạnh/hướng/màu đơn giản", b: "Toàn bộ đối tượng", c: "Nhãn lớp", d: "Không có cấu trúc"}
        answer: a
        explanation: "Lớp sâu tổ hợp thành bộ phận, đối tượng."
      - id: t10
        topic: vgg
        lesson: 03_architectures_lenet_to_resnet.ipynb
        type: mcq
        question: "Vì sao VGG dùng hai conv 3×3 thay cho một conv 5×5?"
        options: {a: "Cùng trường tiếp nhận, ít tham số hơn, thêm một phi tuyến", b: "Nhanh hơn trên CPU", c: "Ít bộ nhớ hơn cho ảnh", d: "Không có lý do"}
        answer: a
        explanation: "18C² so với 25C²."
      - id: t11
        topic: 1x1 conv
        lesson: 03_architectures_lenet_to_resnet.ipynb
        type: mcq
        question: "Conv 1×1 dùng để:"
        options: {a: "Trộn thông tin giữa các kênh và đổi số kênh (bottleneck)", b: "Phát hiện cạnh", c: "Giảm kích thước không gian", d: "Thay thế pooling"}
        answer: a
        explanation: "Inception, ResNet-50."
      - id: t12
        topic: depthwise
        lesson: 03_architectures_lenet_to_resnet.ipynb
        type: mcq
        question: "Depthwise separable convolution (MobileNet) gồm:"
        options: {a: "Conv theo từng kênh (groups = C) rồi conv 1×1", b: "Hai conv 3×3", c: "Pooling rồi conv", d: "Conv 5×5"}
        answer: a
        explanation: "Giảm chi phí ≈ 1/C_out + 1/k² lần."
      - id: t13
        topic: degradation
        lesson: 03_architectures_lenet_to_resnet.ipynb
        type: tf
        question: "Mạng trơn rất sâu có loss TRAIN cao hơn mạng nông hơn là do overfitting."
        answer: false
        explanation: "Đó là vấn đề tối ưu (degradation), không phải overfitting."
      - id: t14
        topic: residual
        lesson: 03_architectures_lenet_to_resnet.ipynb
        type: mcq
        question: "Khối residual tính:"
        options: {a: "y = F(x) + x", b: "y = F(x) · x", c: "y = F(F(x))", d: "y = x − F(x)"}
        answer: a
        explanation: "Gradient chảy thẳng qua nhánh tắt."
      - id: t15
        topic: params zoo
        lesson: 03_architectures_lenet_to_resnet.ipynb
        type: mcq
        question: "Phần lớn tham số của VGG-16 nằm ở:"
        options: {a: "Các lớp fully-connected cuối", b: "Lớp conv đầu tiên", c: "Batch norm", d: "Pooling"}
        answer: a
        explanation: "ResNet dùng global pooling nên gọn hơn."
      - id: t16
        topic: augmentation validity
        lesson: 04_cnn_on_real_images.ipynb
        type: mcq
        question: "Phép augmentation nào KHÔNG phù hợp với CIFAR-10?"
        options: {a: "Lật dọc (lộn ngược) ảnh", b: "Lật ngang ảnh", c: "Dịch chuyển vài pixel", d: "Thay đổi nhẹ độ sáng"}
        answer: a
        explanation: "Ảnh tự nhiên hiếm khi lộn ngược; lật ngang, dịch vài pixel, đổi nhẹ độ sáng vẫn giữ nhãn."
      - id: t17
        topic: channel normalization
        lesson: 04_cnn_on_real_images.ipynb
        type: tf
        question: "Trung bình và độ lệch chuẩn theo kênh dùng để chuẩn hoá ảnh nên tính trên tập train rồi áp dụng cho validation/test."
        answer: true
        explanation: "Giống mọi bước tiền xử lý: fit trên train để không rò rỉ thông tin."
      - id: t18
        topic: why cnn
        lesson: 04_cnn_on_real_images.ipynb
        type: mcq
        question: "Trên cùng 20 000 ảnh CIFAR-10, CNN nhỏ đạt ~73% so với ~40% của mô hình tuyến tính dù chỉ nhiều hơn ~2.4 lần số tham số. Lý do chính:"
        options: {a: "Bộ lọc cục bộ dùng chung trọng số + pooling + đặc trưng phân cấp phù hợp cấu trúc ảnh", b: "CNN có nhiều tham số hơn rất nhiều", c: "CNN dùng optimizer Adam", d: "CNN được huấn luyện thêm trên tập test"}
        answer: a
        explanation: "Thiên kiến quy nạp phù hợp với ảnh quan trọng hơn số tham số."
