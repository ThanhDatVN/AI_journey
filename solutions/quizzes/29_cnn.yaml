coding:
  tasks:
    - id: c01
      title: Kích thước đầu ra conv
      prompt: |
        Viết `conv_out_size(h, k, s, p)` trả về kích thước đầu ra của tích chập theo một chiều.
      code: |
        def conv_out_size(h, k, s=1, p=0):
            ### START CODE HERE ### (≈ 1 dòng)
            return (h + 2 * p - k) // s + 1
            ### END CODE HERE ###
      tests: |
        check_equal(conv_out_size(28, 3, 1, 1), 28, "padding same")
        check_equal(conv_out_size(64, 3, 2, 1), 32, "stride 2")
        check_equal(conv_out_size(13, 3), 11, "không padding")
        check_equal(conv_out_size(7, 3, 2, 0), 3, "làm tròn xuống")
    - id: c02
      title: Tích chập 2D một kênh
      prompt: |
        Viết `conv2d_single(x, k)` (stride 1, không padding) cho ảnh 2D `x` và kernel 2D `k` (cross-correlation).
      code: |
        def conv2d_single(x, k):
            kh, kw = k.shape
            H, W = x.shape[0] - kh + 1, x.shape[1] - kw + 1
            out = np.zeros((H, W))
            ### START CODE HERE ### (≈ 3 dòng)
            for i in range(H):
                for j in range(W):
                    out[i, j] = np.sum(x[i:i + kh, j:j + kw] * k)
            ### END CODE HERE ###
            return out
      tests: |
        x = np.arange(16.0).reshape(4, 4)
        k = np.array([[1.0, 0.0], [0.0, -1.0]])
        check_close(conv2d_single(x, k), np.full((3, 3), -5.0), message="x[i,j] − x[i+1,j+1] = −5")
        rng = np.random.default_rng(0)
        x2, k2 = rng.normal(size=(6, 5)), rng.normal(size=(3, 3))
        from scipy.signal import correlate2d
        check_close(conv2d_single(x2, k2), correlate2d(x2, k2, mode="valid"), message="khớp scipy correlate2d")
analysis:
  prompt: |
    Một bệnh viện xây mô hình phát hiện tổn thương trên ảnh X-quang 1024×1024 (2 000 ảnh có nhãn). Nhóm A dùng MLP trên ảnh thu nhỏ 64×64
    (accuracy val 71%). Nhóm B dùng CNN tự thiết kế 30 lớp không có kết nối tắt, train từ đầu — loss train không giảm. Nhóm C dùng ResNet-50
    với augmentation: lật dọc, xoay 180°, đổi màu ngẫu nhiên; accuracy val 93% nhưng khi triển khai ở bệnh viện khác chỉ còn 75%.
    Đánh giá từng nhóm và đề xuất hướng tiếp cận.
  rubric:
    - "Nhóm A: MLP bỏ cấu trúc không gian, nhiều tham số, thu nhỏ 64×64 có thể mất tổn thương nhỏ; nên dùng CNN"
    - "Nhóm B: mạng trơn 30 lớp gặp degradation/vanishing gradient → kết nối tắt (ResNet), BN, khởi tạo đúng; 2 000 ảnh quá ít để train từ đầu"
    - "Nhóm C: augmentation cần giữ nhãn và hợp miền — lật/xoay có thể phá giải phẫu trái/phải; đổi màu vô nghĩa với ảnh xám"
    - "Nêu chênh lệch triển khai là domain shift (máy chụp, quy trình khác) → đánh giá trên dữ liệu ngoài bệnh viện, chuẩn hoá, fine-tune, dữ liệu đa trung tâm"
    - "Đề xuất transfer learning từ mô hình pretrained (ImageNet hoặc y tế), độ phân giải đủ cao, metric phù hợp (sensitivity), kiểm định lâm sàng"
  sample_answer: |
    A: MLP coi 4 096 pixel là vector, mất cấu trúc không gian, cần nhiều dữ liệu; thu nhỏ 64×64 có thể xoá tổn thương nhỏ → dùng CNN ở độ phân giải
    cao hơn. B: CNN trơn 30 lớp gặp degradation/vanishing gradient → loss không giảm; dùng residual + BN + He init; và 2 000 ảnh là quá ít để train
    sâu từ đầu → transfer learning. C: augmentation phải giữ nhãn và hợp với miền — lật trái/phải có thể đổi ý nghĩa giải phẫu (tim nằm bên trái),
    xoay 180° phi thực tế, đổi màu vô nghĩa với ảnh xám; dùng dịch/xoay nhỏ, đổi độ tương phản. 93% → 75% ở bệnh viện khác là domain shift (máy
    chụp, quy trình, quần thể bệnh nhân): cần validation ngoài, dữ liệu đa trung tâm, chuẩn hoá cường độ, fine-tune; báo cáo sensitivity/specificity
    theo từng nơi, kiểm định lâm sàng trước khi dùng.
project:
  prompt: |
    **Mini project — Tổng quát hoá ra vị trí mới.** Train **chỉ** với `make_shapes(3000, region="left", seed=40)`; đánh giá trên
    `make_shapes(1000, region="right", seed=41)` (hình ở vị trí chưa từng thấy). Yêu cầu accuracy trên nửa phải `right_acc` ≥ 0.75.
    Gợi ý: kiến trúc nào bất biến với vị trí? Hoặc augmentation nào?
  code: |
    import torch
    from torch import nn
    from ml_course.datasets import make_shapes

    device = "cuda" if torch.cuda.is_available() else "cpu"
    torch.backends.cudnn.deterministic = True
    to_t = lambda a: torch.tensor(a[:, None], dtype=torch.float32)
    XL, yL = make_shapes(3000, region="left", seed=40)
    XR, yR = make_shapes(1000, region="right", seed=41)
    XL, XR, yL, yR = to_t(XL), to_t(XR), torch.tensor(yL), torch.tensor(yR)
    torch.manual_seed(0)
    ### START CODE HERE ### (≈ 18 dòng)
    model = nn.Sequential(nn.Conv2d(1, 16, 3, padding=1), nn.BatchNorm2d(16), nn.ReLU(), nn.MaxPool2d(2),
                          nn.Conv2d(16, 32, 3, padding=1), nn.BatchNorm2d(32), nn.ReLU(), nn.MaxPool2d(2),
                          nn.Conv2d(32, 64, 3, padding=1), nn.BatchNorm2d(64), nn.ReLU(),
                          nn.AdaptiveAvgPool2d(1), nn.Flatten(), nn.Linear(64, 5)).to(device)
    opt = torch.optim.Adam(model.parameters(), lr=1e-3)
    g = torch.Generator().manual_seed(0)
    for epoch in range(15):
        model.train()
        perm = torch.randperm(len(XL), generator=g)
        for s in range(0, len(perm), 64):
            idx = perm[s:s + 64]
            opt.zero_grad()
            nn.functional.cross_entropy(model(XL[idx].to(device)), yL[idx].to(device)).backward()
            opt.step()
    model.eval()
    with torch.no_grad():
        right_acc = (model(XR.to(device)).argmax(1).cpu() == yR).float().mean().item()
    ### END CODE HERE ###
    print(f"accuracy trên nửa phải (vị trí chưa từng thấy) = {right_acc:.3f}")
  tests: |
    check_greater(right_acc, 0.75, "tổng quát hoá ra vị trí mới ≥ 0.75")
