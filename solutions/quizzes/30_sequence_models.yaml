        lesson: 02_vanishing_exploding_gradients.ipynb
        type: mcq
        question: "Gradient từ bước T về bước k của RNN tanh là tích (T − k) ma trận diag(1 − h²)W_hh. Khi bán kính phổ của W_hh nhỏ hơn 1:"
        options: {a: "Gradient tắt dần theo hàm mũ", b: "Gradient bùng nổ", c: "Gradient không đổi", d: "Gradient luôn bằng 1"}
        answer: a
        explanation: "Không học được phụ thuộc xa."
      - id: t06
        topic: clipping
        lesson: 02_vanishing_exploding_gradients.ipynb
        type: multi
        question: "Gradient clipping:"
        options: {a: "Giới hạn độ dài gradient, giữ hướng", b: "Ngăn bùng nổ thành NaN", c: "Chữa vanishing gradient", d: "Thay thế được learning rate hợp lý"}
        answer: ab
        explanation: "Chỉ là lưới an toàn cho exploding."
      - id: t07
        topic: lstm cell
        lesson: 03_lstm_gru.ipynb
        type: mcq
        question: "Trong LSTM, c_t = f ⊙ c_{t−1} + i ⊙ g. Đường đi này giúp gradient vì:"
        options:
          a: "∂c_t/∂c_{t−1} = diag(f) — không nhân ma trận W hay tanh'; f ≈ 1 thì gradient gần nguyên vẹn"
          b: "Vì có nhiều tham số hơn"
          c: "Vì dùng ReLU"
          d: "Vì không có bias"
        answer: a
        explanation: "Đường cộng."
      - id: t08
        topic: forget bias
        lesson: 03_lstm_gru.ipynb
        type: tf
        question: "Khởi tạo bias cổng quên của LSTM bằng giá trị dương (vd 1) giúp mặc định 'nhớ' và học phụ thuộc xa dễ hơn."
        answer: true
        explanation: "Jozefowicz et al. (2015)."
      - id: t09
        topic: gru
        lesson: 03_lstm_gru.ipynb
        type: mcq
        question: "GRU khác LSTM ở chỗ:"
        options: {a: "Không có trạng thái ô riêng; hai cổng (cập nhật, reset); ít tham số hơn", b: "Không có cổng", c: "Chỉ dùng cho ảnh", d: "Không train bằng BPTT"}
        answer: a
        explanation: "3 khối trọng số so với 4."
      - id: t10
        topic: bidirectional
        lesson: 03_lstm_gru.ipynb
        type: tf
        question: "LSTM hai chiều phù hợp cho dự báo chuỗi thời gian bước tiếp theo."
        answer: false
        explanation: "Nhìn tương lai — chỉ dùng khi có toàn bộ chuỗi lúc dự đoán."
      - id: t11
        topic: padding
        lesson: 03_lstm_gru.ipynb
        type: mcq
        question: "Với batch chuỗi độ dài khác nhau đệm ở cuối, lấy out[:, −1] làm biểu diễn chuỗi là:"
        options: {a: "Sai với chuỗi ngắn — đó là trạng thái sau khi đọc phần đệm; dùng pack_padded_sequence hoặc lấy tại lens − 1", b: "Đúng", c: "Chỉ sai với LSTM", d: "Chỉ sai khi batch = 1"}
        answer: a
        explanation: "Bài tập 7."
      - id: t12
        topic: teacher forcing
        lesson: 04_seq2seq_and_attention.ipynb
        type: mcq
        question: "Teacher forcing nghĩa là khi train decoder:"
        options: {a: "Đầu vào mỗi bước là token đúng của bước trước", b: "Đầu vào là dự đoán của chính mô hình", c: "Không dùng encoder", d: "Dùng nhãn của batch khác"}
        answer: a
        explanation: "Gây exposure bias khi suy luận."
      - id: t13
        topic: bottleneck
        lesson: 04_seq2seq_and_attention.ipynb
        type: mcq
        question: "Seq2seq không attention giảm độ chính xác khi chuỗi dài vì:"
        options: {a: "Toàn bộ chuỗi nguồn phải nén vào một vector ngữ cảnh kích thước cố định", b: "Decoder quá sâu", c: "Không dùng softmax", d: "Thiếu dữ liệu"}
        answer: a
        explanation: "Attention cho truy cập mọi trạng thái encoder."
      - id: t14
        topic: attention
        lesson: 04_seq2seq_and_attention.ipynb
        type: multi
        question: "Dot-product attention:"
        options:
          a: "Tính điểm giữa trạng thái decoder và từng trạng thái encoder"
          b: "Chuẩn hoá điểm bằng softmax"
          c: "Ngữ cảnh = trung bình có trọng số các trạng thái encoder"
          d: "Bắt buộc dùng CNN"
        answer: abc
        explanation: "Trọng số attention cho thấy căn chỉnh."
      - id: t15
        topic: beam
        lesson: 04_seq2seq_and_attention.ipynb
        type: mcq
        question: "Beam search so với greedy:"
        options: {a: "Giữ k ứng viên tốt nhất mỗi bước, thường tìm chuỗi có tổng log-prob cao hơn", b: "Luôn tạo văn bản đa dạng hơn", c: "Nhanh hơn greedy", d: "Không cần mô hình"}
        answer: a
        explanation: "Sinh văn bản tự do thường dùng lấy mẫu thay vì beam."
      - id: t16
        topic: length generalization
        lesson: 04_seq2seq_and_attention.ipynb
        type: tf
        question: "Seq2seq có attention train với chuỗi dài tối đa 15 thường xử lý tốt chuỗi dài 20."
        answer: false
        explanation: "Thí nghiệm: cả hai mô hình đều thất bại ở độ dài chưa thấy."
