        type: mcq
        question: "Truncated BPTT:"
        options:
          a: "Cắt gradient sau một số bước cố định để tiết kiệm tính toán, đổi lại không học phụ thuộc dài hơn cửa sổ"
          b: "Cắt bớt dữ liệu"
          c: "Làm tròn trọng số"
          d: "Dừng train sớm"
