coding:
  tasks:
    - id: c01
      title: Bước RNN
      prompt: |
        Viết `rnn_step(x, h, W_xh, W_hh, b)` trả về tanh(W_xh x + W_hh h + b).
      code: |
        def rnn_step(x, h, W_xh, W_hh, b):
            ### START CODE HERE ### (≈ 1 dòng)
            return np.tanh(W_xh @ x + W_hh @ h + b)
            ### END CODE HERE ###
      tests: |
        import torch
        torch.manual_seed(0)
        cell = torch.nn.RNNCell(3, 4).double()
        x, h = torch.randn(3, dtype=torch.float64), torch.randn(4, dtype=torch.float64)
        ref = cell(x[None], h[None])[0].detach().numpy()
        W = {k: v.detach().numpy() for k, v in cell.state_dict().items()}
        check_close(rnn_step(x.numpy(), h.numpy(), W["weight_ih"], W["weight_hh"], W["bias_ih"] + W["bias_hh"]), ref, tol=1e-10, message="khớp nn.RNNCell")
    - id: c02
      title: Trọng số attention
      prompt: |
        Viết `attention_weights(s, H)`: s vector trạng thái decoder (d,), H ma trận trạng thái encoder (T, d); trả về softmax(H s).
      code: |
        def attention_weights(s, H):
            ### START CODE HERE ### (≈ 3 dòng)
            scores = H @ s
            e = np.exp(scores - scores.max())
            return e / e.sum()
            ### END CODE HERE ###
      tests: |
        H = np.array([[1.0, 0.0], [0.0, 1.0], [1.0, 1.0]])
        w = attention_weights(np.array([0.0, np.log(3.0)]), H)
        check_close(w.sum(), 1.0, message="tổng = 1")
        check_close(w, np.array([1.0, 3.0, 3.0]) / 7, message="softmax([0, ln3, ln3])")
        check_true(np.isfinite(attention_weights(np.array([1000.0, 0.0]), H)).all(), "ổn định số")
analysis:
  prompt: |
    Một ngân hàng muốn phát hiện giao dịch gian lận từ chuỗi 200 giao dịch gần nhất của mỗi tài khoản. Đề xuất: (1) RNN tanh 1 lớp,
    đọc 200 giao dịch, không clipping; (2) đặc trưng: số tiền, loại giao dịch; (3) dùng LSTM hai chiều để "tận dụng tối đa ngữ cảnh"
    khi chấm điểm giao dịch mới nhất theo thời gian thực; (4) đánh giá bằng chia ngẫu nhiên các tài khoản... nhưng có cả chia ngẫu nhiên
    các cửa sổ chồng lấn của cùng một tài khoản. Loss huấn luyện đôi khi thành NaN. Đánh giá và đề xuất.
  rubric:
    - "Chỉ ra RNN tanh với 200 bước gặp vanishing gradient (không học được tín hiệu xa) → LSTM/GRU (bias cổng quên), hoặc attention/Transformer; truncated hoặc tổng hợp đặc trưng"
    - "Chỉ ra NaN do exploding gradient → gradient clipping, LR nhỏ hơn, khởi tạo hợp lý"
    - "Chỉ ra LSTM hai chiều không dùng được khi chấm điểm thời gian thực (cần nhân quả) — chỉ dùng một chiều"
    - "Chỉ ra rò rỉ khi chia ngẫu nhiên cửa sổ chồng lấn của cùng tài khoản → chia theo tài khoản và theo thời gian"
    - "Đề xuất đặc trưng thứ tự/thời gian (khoảng cách thời gian, thiết bị, vị trí), mất cân bằng (chương 19), so baseline (boosting trên đặc trưng tổng hợp)"
  sample_answer: |
    (1) RNN tanh với 200 bước: gradient tới giao dịch xa tắt dần → mô hình chỉ thấy vài giao dịch cuối; dùng LSTM/GRU (bias cổng quên = 1),
    hoặc attention; cân nhắc tổng hợp đặc trưng lịch sử cho boosting. (2) NaN = exploding gradient: bật clipping, giảm LR, khởi tạo trực giao.
    (3) Chấm điểm thời gian thực chỉ có quá khứ → LSTM hai chiều không hợp lệ (nhìn tương lai trong train, không có lúc suy luận); dùng một chiều.
    (4) Cửa sổ chồng lấn của cùng tài khoản rơi vào cả train và test → rò rỉ, đánh giá lạc quan; chia theo tài khoản và theo thời gian (backtest).
    Thêm: khoảng thời gian giữa giao dịch, thiết bị/vị trí, kênh; xử lý mất cân bằng; metric PR-AUC/precision@k; so với baseline boosting.
project:
  prompt: |
    **Mini project — Học thứ tự sự kiện.** Phiên gồm 10–30 sự kiện (mã 0–5 ngẫu nhiên), mỗi phiên có đúng một sự kiện 6 và một sự kiện 7;
    nhãn = 1 nếu 7 xuất hiện **sau** 6. Train trên `make_sessions(2000, seed=10)`, test trên `make_sessions(1000, seed=11)`. Yêu cầu
    accuracy test `acc` ≥ 0.95.
  code: |
    import torch
    from torch import nn
    from torch.nn.utils.rnn import pack_padded_sequence

    def make_sessions(n, seed):
        r = np.random.default_rng(seed)
        seqs, labels = [], []
        for _ in range(n):
            L = r.integers(10, 31)
            s = [int(v) for v in r.integers(0, 6, L)]
            p1, p2 = sorted(r.choice(L + 2, 2, replace=False))
            sus = r.random() < 0.5
            a, b = (6, 7) if sus else (7, 6)
            s.insert(p1, a)
            s.insert(p2, b)
            seqs.append(s)
            labels.append(int(sus))
        return seqs, np.array(labels)

    tr_seqs, y_tr = make_sessions(2000, seed=10)
    te_seqs, y_te = make_sessions(1000, seed=11)
    torch.manual_seed(0)
    ### START CODE HERE ### (≈ 25 dòng)
    def pad(seqs):
        lens = torch.tensor([len(s) for s in seqs])
        X = torch.full((len(seqs), int(lens.max())), 8, dtype=torch.long)
        for i, s in enumerate(seqs):
            X[i, :len(s)] = torch.tensor(s)
        return X, lens

    class M(nn.Module):
        def __init__(self):
            super().__init__()
            self.emb = nn.Embedding(9, 16, padding_idx=8)
            self.gru = nn.GRU(16, 32, batch_first=True)
            self.out = nn.Linear(32, 2)

        def forward(self, x, lens):
            _, h = self.gru(pack_padded_sequence(self.emb(x), lens, batch_first=True, enforce_sorted=False))
            return self.out(h[-1])

    Xtr, Ltr = pad(tr_seqs)
    Xte, Lte = pad(te_seqs)
    ytr = torch.tensor(y_tr)
    model = M()
    opt = torch.optim.Adam(model.parameters(), lr=3e-3)
    for epoch in range(15):
        perm = torch.randperm(len(Xtr))
        for s in range(0, len(perm), 64):
            idx = perm[s:s + 64]
            opt.zero_grad()
            nn.functional.cross_entropy(model(Xtr[idx], Ltr[idx]), ytr[idx]).backward()
            opt.step()
    model.eval()
    with torch.no_grad():
        acc = (model(Xte, Lte).argmax(1).numpy() == y_te).mean()
    ### END CODE HERE ###
    print(f"accuracy test = {acc:.3f}")
  tests: |
    check_greater(acc, 0.95, "accuracy test ≥ 0.95")
