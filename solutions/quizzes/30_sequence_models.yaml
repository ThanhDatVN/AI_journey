title: "30 · Sequence Models"
sections:
  theory:
    questions:
      - id: t01
        topic: weight sharing
        lesson: 01_rnn_from_scratch.ipynb
        type: tf
        question: "Số tham số của một RNN không phụ thuộc độ dài chuỗi đầu vào."
