        type: mcq
        question: "Dịch một câu tiếng Anh sang tiếng Việt là dạng bài toán:"
        options: {a: "many-to-many (độ dài vào/ra khác nhau) — encoder–decoder", b: "many-to-one", c: "one-to-one", d: "phân cụm"}
        answer: a
        explanation: "Seq2seq."
      - id: t03
        topic: bptt
        lesson: 01_rnn_from_scratch.ipynb
        type: mcq
        question: "Trong BPTT, gradient theo trạng thái h_t nhận đóng góp từ:"
        options: {a: "Đầu ra tại bước t và trạng thái h_{t+1}", b: "Chỉ đầu ra tại bước t", c: "Chỉ h_{t−1}", d: "Không có gì"}
        answer: a
