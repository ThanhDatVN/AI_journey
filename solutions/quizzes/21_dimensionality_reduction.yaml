title: "21 · Dimensionality Reduction"
sections:
  theory:
    questions:
      - id: t01
        topic: PCA objective
        lesson: 01_pca_from_scratch.ipynb
        type: mcq
        question: "Thành phần chính thứ nhất (PC1) là hướng:"
        options: {a: "Phương sai của dữ liệu chiếu lên lớn nhất", b: "Tương quan với target lớn nhất", c: "Trục x", d: "Phương sai nhỏ nhất"}
        answer: a
        explanation: "Vector riêng của trị riêng lớn nhất."
      - id: t02
        topic: equivalence
        lesson: 01_pca_from_scratch.ipynb
        type: tf
        question: "Tối đa phương sai hình chiếu tương đương tối thiểu sai số tái tạo (khoảng cách vuông góc)."
        answer: true
        explanation: "Hai góc nhìn của PCA."
      - id: t03
        topic: centering
        lesson: 01_pca_from_scratch.ipynb
        type: mcq
        question: "Vì sao trừ trung bình trước PCA?"
        options:
          a: "Để các thành phần mô tả biến thiên quanh trung bình chứ không phải vị trí của dữ liệu"
          b: "Để tăng tốc"
          c: "Để dữ liệu dương"
          d: "Không cần thiết"
        answer: a
        explanation: "Ma trận hiệp phương sai tính trên dữ liệu đã center."
      - id: t04
        topic: SVD
        lesson: 01_pca_from_scratch.ipynb
        type: mcq
        question: "Với X_c = UΣVᵀ, phương sai của thành phần j bằng:"
        options: {a: "σⱼ", b: "σⱼ²/(n − 1)", c: "1/σⱼ", d: "Uⱼⱼ"}
        answer: b
        explanation: "λ = σ²/(n − 1)."
      - id: t05
        topic: PCA vs regression
        lesson: 01_pca_from_scratch.ipynb
        type: mcq
        question: "Khác biệt giữa đường PC1 và đường Linear Regression:"
        options:
          a: "PCA tối thiểu khoảng cách vuông góc, đối xứng giữa các biến; hồi quy tối thiểu sai số theo trục y"
          b: "Giống hệt nhau"
          c: "PCA chỉ cho dữ liệu 2D"
          d: "Hồi quy không có hệ số chặn"
        answer: a
        explanation: "PCA không có biến mục tiêu."
      - id: t06
        topic: scaling
        lesson: 02_pca_in_practice.ipynb
        type: mcq
        question: "Feature có đơn vị khác nhau (diện tích m², tuổi năm, giá VND). Trước PCA nên:"
        options: {a: "Chuẩn hoá (StandardScaler)", b: "Không làm gì", c: "One-hot", d: "Log mọi cột"}
        answer: a
        explanation: "Không scale → PC1 ≈ feature có đơn vị lớn nhất."
      - id: t07
        topic: unsupervised
        lesson: 02_pca_in_practice.ipynb
        type: tf
        question: "PCA chọn hướng dựa trên khả năng dự đoán target."
        answer: false
        explanation: "PCA không nhìn nhãn — có thể vứt tín hiệu."
      - id: t08
        topic: denoising
        lesson: 02_pca_in_practice.ipynb
        type: mcq
        question: "Vì sao chiếu lên vài thành phần đầu rồi tái tạo có thể khử nhiễu?"
        options:
          a: "Tín hiệu tập trung ở vài hướng đầu, nhiễu phân tán đều trên mọi hướng"
          b: "PCA biết đâu là nhiễu"
          c: "Vì làm mượt ảnh"
          d: "Không khử được"
        answer: a
        explanation: "Bỏ các hướng phần lớn là nhiễu."
      - id: t09
        topic: variants
        lesson: 02_pca_in_practice.ipynb
        type: mcq
        question: "Ma trận TF-IDF thưa 200 000 cột. Phương pháp giảm chiều phù hợp:"
        options: {a: "PCA (cần trừ trung bình → ma trận dày)", b: "TruncatedSVD", c: "t-SNE trực tiếp", d: "Kernel PCA"}
        answer: b
        explanation: "Không cần center, làm việc trên ma trận thưa (LSA)."
      - id: t10
        topic: pipeline
        lesson: 02_pca_in_practice.ipynb
        type: tf
        question: "PCA dùng làm tiền xử lý phải được fit bên trong Pipeline/CV, không fit trên toàn bộ dữ liệu trước."
        answer: true
        explanation: "Mọi bước học từ dữ liệu."
      - id: t11
        topic: t-SNE goal
        lesson: 03_tsne_umap.ipynb
        type: mcq
        question: "t-SNE ưu tiên giữ:"
        options: {a: "Khoảng cách toàn cục", b: "Láng giềng cục bộ", c: "Phương sai", d: "Thứ tự các điểm"}
        answer: b
        explanation: "KL phạt nặng khi láng giềng gần bị đặt xa."
      - id: t12
        topic: student-t
        lesson: 03_tsne_umap.ipynb
        type: mcq
        question: "t-SNE dùng phân phối Student-t (đuôi nặng) ở không gian thấp chiều để:"
        options: {a: "Giảm crowding problem — cho phép điểm vừa xa được đặt xa", b: "Tăng tốc", c: "Giữ phương sai", d: "Làm kết quả xác định"}
        answer: a
        explanation: "van der Maaten & Hinton (2008)."
      - id: t13
        topic: pitfalls
        lesson: 03_tsne_umap.ipynb
        type: multi
        question: "Trên biểu đồ t-SNE, điều gì KHÔNG nên diễn giải định lượng?"
        options: {a: "Kích thước cụm", b: "Khoảng cách giữa các cụm", c: "Việc vài điểm là láng giềng gần nhau", d: "Vị trí tuyệt đối của cụm"}
        answer: abd
        explanation: "Láng giềng cục bộ là phần đáng tin nhất."
      - id: t14
        topic: perplexity
        lesson: 03_tsne_umap.ipynb
        type: mcq
        question: "Perplexity trong t-SNE xấp xỉ:"
        options: {a: "Số láng giềng hiệu dụng mỗi điểm xem xét", b: "Số chiều đầu ra", c: "Learning rate", d: "Số cụm"}
        answer: a
        explanation: "Nhỏ → cấu trúc vụn; lớn → mượt, toàn cục hơn."
      - id: t15
        topic: transform
        lesson: 03_tsne_umap.ipynb
        type: multi
        question: "Phương pháp nào có transform cho điểm mới?"
        options: {a: "PCA", b: "UMAP", c: "t-SNE (sklearn)", d: "Kernel PCA"}
        answer: abd
        explanation: "t-SNE không ánh xạ điểm mới."
      - id: t16
        topic: features
        lesson: 03_tsne_umap.ipynb
        type: tf
        question: "Toạ độ t-SNE 2D là feature tốt để train model phân loại."
        answer: false
        explanation: "Không có transform, phụ thuộc seed, méo khoảng cách."
  math:
    questions:
