        lesson: 01_pca_from_scratch.ipynb
        type: numeric
        decimals: 2
        question: "C = [[3, 0], [0, 1]]. Trị riêng lớn nhất = ?"
        answer: 3
        explanation: "Ma trận chéo."
coding:
  tasks:
    - id: c01
      title: PCA qua SVD
      prompt: |
        Viết `pca_fit(X, k)` trả về `(mean, components, explained_variance)`: trừ trung bình, SVD, k hàng đầu của Vᵀ, phương sai σ²/(n − 1).
      code: |
        def pca_fit(X, k):
            ### START CODE HERE ### (≈ 4 dòng)
            mean = X.mean(0)
            _, S, Vt = np.linalg.svd(X - mean, full_matrices=False)
            components = Vt[:k]
            explained_variance = S[:k] ** 2 / (len(X) - 1)
            ### END CODE HERE ###
            return mean, components, explained_variance
      tests: |
        from sklearn.decomposition import PCA
        rng = np.random.default_rng(0)
        X = rng.normal(size=(200, 6)) @ rng.normal(size=(6, 6))
        mean, comps, var = pca_fit(X, 3)
        ref = PCA(3).fit(X)
        check_close(var, ref.explained_variance_, tol=1e-8, message="phương sai")
        check_close(np.abs((comps * ref.components_).sum(1)), np.ones(3), tol=1e-8, message="thành phần (đến dấu)")
    - id: c02
      title: Tái tạo
      prompt: |
        Viết `reconstruct(X, mean, components)` = chiếu lên các thành phần rồi tái tạo về không gian gốc.
      code: |
        def reconstruct(X, mean, components):
            ### START CODE HERE ### (≈ 2 dòng)
            Z = (X - mean) @ components.T
            X_hat = Z @ components + mean
            ### END CODE HERE ###
            return X_hat
      tests: |
        from sklearn.decomposition import PCA
        rng = np.random.default_rng(1)
        X = rng.normal(size=(100, 5)) @ rng.normal(size=(5, 5))
        p = PCA(2).fit(X)
        check_close(reconstruct(X, p.mean_, p.components_), p.inverse_transform(p.transform(X)), tol=1e-8, message="khớp sklearn")
        p5 = PCA(5).fit(X)
        check_close(reconstruct(X, p5.mean_, p5.components_), X, tol=1e-8, message="giữ đủ thành phần → tái tạo hoàn hảo")
analysis:
  prompt: |
    Một nhóm có 300 feature từ cảm biến máy móc (nhiệt độ °C, áp suất Pa, độ rung mm/s, dòng điện A...) để dự đoán hỏng hóc (2% positive).
    Họ: (1) chạy PCA trên dữ liệu thô (không chuẩn hoá) và toàn bộ dữ liệu trước khi chia train/test; (2) giữ 2 thành phần vì "giải thích 99.9%
    phương sai"; (3) model trên 2 thành phần cho kết quả kém; (4) vẽ t-SNE thấy "các máy hỏng tạo thành cụm nhỏ xa các máy khác" nên kết luận
    chúng "rất khác biệt" và dùng toạ độ t-SNE làm feature. Đánh giá và đề xuất.
  rubric:
    - "Chỉ ra không chuẩn hoá: áp suất (Pa, giá trị lớn) chiếm gần hết phương sai → 99.9% là ảo, PC1–2 chỉ là áp suất"
    - "Chỉ ra PCA fit trên toàn bộ dữ liệu trước khi chia → rò rỉ; đặt vào Pipeline"
    - "Chỉ ra PCA không nhìn nhãn — tín hiệu hỏng hóc có thể nằm ở hướng phương sai nhỏ → chọn số thành phần bằng CV, cân nhắc phương pháp có giám sát hoặc không giảm chiều"
    - "Chỉ ra kích thước/khoảng cách cụm trên t-SNE không có ý nghĩa định lượng; cần kiểm chứng bằng cách khác"
    - "Chỉ ra toạ độ t-SNE không dùng làm feature (không có transform, phụ thuộc seed)"
  sample_answer: |
    (1) Không chuẩn hoá: áp suất theo Pa có giá trị ~10⁵ → phương sai áp đảo; "99.9% phương sai" chỉ là phương sai của áp suất. Chuẩn hoá trước PCA.
    (2) PCA fit trên toàn bộ dữ liệu → rò rỉ; Pipeline(StandardScaler, PCA, model) trong CV.
    (3) PCA không nhìn nhãn; hỏng hóc hiếm (2%) có thể thể hiện ở hướng phương sai nhỏ → 2 thành phần vứt tín hiệu. Chọn số thành phần bằng CV theo metric PR-AUC, hoặc dùng model trên feature gốc (boosting), feature selection.
    (4) t-SNE: cụm nhỏ/xa không có nghĩa "rất khác biệt"; kiểm chứng bằng so sánh feature, clustering trên không gian gốc.
    (5) Không dùng toạ độ t-SNE làm feature (không có transform cho dữ liệu mới, phụ thuộc seed, méo khoảng cách).
project:
  prompt: |
    **Mini project — PCA + KNN cho chữ số viết tay.** Dùng `load_digits()`. Chia train/test 75/25 (`random_state=0`, `stratify`).
    Xây Pipeline PCA → KNN, chọn `n_components` và `n_neighbors` bằng GridSearchCV (5-fold) trên train. Yêu cầu accuracy test ≥ 0.98
    (biến `test_acc`) **và** số thành phần ≤ 40 (biến `n_comp`).
  code: |
    from sklearn.datasets import load_digits
    from sklearn.decomposition import PCA
    from sklearn.model_selection import GridSearchCV, train_test_split
    from sklearn.neighbors import KNeighborsClassifier
    from sklearn.pipeline import make_pipeline

    X, y = load_digits(return_X_y=True)
    X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, random_state=0, stratify=y)
    ### START CODE HERE ### (≈ 5 dòng)
    grid = GridSearchCV(make_pipeline(PCA(), KNeighborsClassifier()),
                        {"pca__n_components": [10, 20, 30, 40], "kneighborsclassifier__n_neighbors": [1, 3, 5]}, cv=5).fit(X_tr, y_tr)
    test_acc = grid.score(X_te, y_te)
    n_comp = grid.best_params_["pca__n_components"]
    ### END CODE HERE ###
    print(grid.best_params_, "| accuracy test:", round(test_acc, 4))
  tests: |
    check_greater(test_acc, 0.98, "accuracy test ≥ 0.98")
    check_less(n_comp, 41, "≤ 40 thành phần")
