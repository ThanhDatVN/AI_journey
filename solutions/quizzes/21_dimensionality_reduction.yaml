        explanation: "400/100."
      - id: m04
        topic: compression
        lesson: 02_pca_in_practice.ipynb
        type: numeric
        decimals: 0
        question: "1 000 ảnh 64 pixel, giữ 10 thành phần. Số con số cần lưu (toạ độ + thành phần + mean)?"
        answer: 10704
        explanation: "1000·10 + 10·64 + 64."
      - id: m05
