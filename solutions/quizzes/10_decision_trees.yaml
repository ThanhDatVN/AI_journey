        question: "Tăng ccp_alpha trong sklearn thì:"
        options: {a: "Cây lớn hơn", b: "Cây bị cắt nhiều hơn (ít lá hơn)", c: "Học nhanh hơn", d: "Không ảnh hưởng"}
