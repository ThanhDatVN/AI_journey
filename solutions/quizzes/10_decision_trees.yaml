      - id: t14
        topic: scaling
        lesson: 05_failure_cases_and_interpretation.ipynb
        type: tf
        question: "Decision Tree cần chuẩn hoá feature (StandardScaler) để hoạt động tốt."
        answer: false
        explanation: "Split chỉ phụ thuộc thứ tự giá trị."
      - id: t15
        topic: MDI bias
        lesson: 05_failure_cases_and_interpretation.ipynb
        type: mcq
        question: "Một cột ID ngẫu nhiên (mọi giá trị khác nhau) nhận MDI importance cao. Nguyên nhân?"
        options:
          a: "ID thực sự quan trọng"
          b: "MDI tính trên train, thưởng cho split học thuộc nhiễu, thiên vị feature nhiều giá trị"
          c: "Lỗi của sklearn"
          d: "Do không scale"
        answer: b
        explanation: "Dùng permutation importance trên held-out + regularize model."
      - id: t16
        topic: diagonal boundary
        lesson: 05_failure_cases_and_interpretation.ipynb
        type: mcq
        question: "Cách nhanh nhất giúp cây nông học ranh giới x1 + x2 > 0:"
        options: {a: "Tăng max_depth lên 50", b: "Thêm feature x1 + x2", c: "Dùng entropy thay Gini", d: "Scale dữ liệu"}
        answer: b
