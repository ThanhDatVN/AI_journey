        answer: 0.02
        explanation: "(0.18 − 0.10)/(5 − 1) = 0.02 — weakest link."
coding:
  tasks:
    - id: c01
      title: Gini và information gain
      prompt: |
        Viết `gini(y)` và `gini_gain(y, mask)` — mức giảm Gini khi chia `y` thành `y[mask]` và `y[~mask]` (có trọng số theo số mẫu).
      code: |
        def gini(y):
            ### START CODE HERE ### (≈ 2 dòng)
            _, counts = np.unique(y, return_counts=True)
            p = counts / counts.sum()
            ### END CODE HERE ###
            return 1 - np.sum(p**2)


        def gini_gain(y, mask):
            ### START CODE HERE ### (≈ 2 dòng)
            left, right = y[mask], y[~mask]
            child = (len(left) * gini(left) + len(right) * gini(right)) / len(y)
            ### END CODE HERE ###
            return gini(y) - child
      tests: |
        y = np.array([0, 0, 0, 1, 1, 1, 1, 2])
        check_close(gini(y), 1 - (9 + 16 + 1) / 64, message="gini 3 lớp")
        check_close(gini_gain(np.array([0, 0, 1, 1]), np.array([True, True, False, False])), 0.5, message="split hoàn hảo")
        check_close(gini_gain(np.array([0, 1, 0, 1]), np.array([True, True, False, False])), 0.0, message="split vô ích")
    - id: c02
      title: Split hồi quy tốt nhất
      prompt: |
        Viết `best_threshold_regression(x, y)` trả về ngưỡng (trung điểm giữa hai giá trị liên tiếp khác nhau của `x` đã sắp xếp)
        làm **tổng SSE hai bên** nhỏ nhất. Được phép dùng vòng lặp.
      code: |
        def best_threshold_regression(x, y):
            order = np.argsort(x)
            xs, ys = x[order], y[order]
            best_t, best_sse = None, np.inf
            ### START CODE HERE ### (≈ 6 dòng)
            for i in range(len(xs) - 1):
                if xs[i] == xs[i + 1]:
                    continue
                left, right = ys[: i + 1], ys[i + 1 :]
                sse = ((left - left.mean()) ** 2).sum() + ((right - right.mean()) ** 2).sum()
                if sse < best_sse:
                    best_t, best_sse = (xs[i] + xs[i + 1]) / 2, sse
            ### END CODE HERE ###
            return best_t
      tests: |
        from sklearn.tree import DecisionTreeRegressor
        rng = np.random.default_rng(2)
        x = rng.uniform(0, 10, 80)
        y = np.where(x > 6.3, 5.0, 1.0) + rng.normal(0, 0.3, 80)
        t = best_threshold_regression(x, y)
        ref = DecisionTreeRegressor(max_depth=1).fit(x[:, None], y).tree_.threshold[0]
        check_close(t, ref, tol=1e-4, message="khớp sklearn stump (sklearn lưu ngưỡng float32)")
analysis:
  prompt: |
    Một ngân hàng dùng Decision Tree không giới hạn độ sâu để xét duyệt khoản vay. Báo cáo của nhóm:
    "accuracy 100% (trên dữ liệu train), feature quan trọng nhất là `customer_id` (MDI = 0.31), mô hình dễ giải thích nên đủ để trình
    cơ quan quản lý." Khi train lại với dữ liệu tháng mới, cây có cấu trúc khác hẳn và một số khách hàng bị đổi kết quả.
    Đánh giá và đề xuất.
  rubric:
    - "Chỉ ra accuracy 100% trên train là overfit/vô nghĩa → đánh giá bằng CV/test"
    - "Chỉ ra customer_id có MDI cao là do thiên lệch MDI với feature nhiều giá trị/học thuộc → loại ID, dùng permutation importance trên held-out"
    - "Đề xuất giới hạn độ phức tạp: max_depth/min_samples_leaf/ccp_alpha chọn bằng CV"
    - "Chỉ ra cây không ổn định (variance cao) → kết quả thay đổi khi dữ liệu thay đổi; đề xuất kiểm tra độ ổn định, ensemble hoặc cây nhỏ có kiểm định"
    - "Nhận xét 'dễ giải thích' chỉ đúng với cây nhỏ; cây sâu hàng trăm lá không dễ giải thích, và cấu trúc cây không phải nhân quả"
  sample_answer: |
    (1) Accuracy 100% trên train của cây không giới hạn là tất yếu (mỗi lá thuộc lòng vài mẫu) — phải báo cáo CV/test.
    (2) customer_id có MDI cao vì cây dùng nó để "học thuộc" từng khách hàng; MDI tính trên train thiên vị feature nhiều giá trị → loại ID, dùng permutation importance trên held-out.
    (3) Chọn max_depth/min_samples_leaf/ccp_alpha bằng CV.
    (4) Cây sâu có variance cao: dữ liệu tháng mới → cây khác → quyết định thay đổi; kiểm tra độ ổn định (bootstrap), cân nhắc ensemble + giải thích (SHAP) hoặc cây nhỏ đã kiểm định.
    (5) Cây hàng trăm lá không "dễ giải thích"; các split là liên hệ, không phải nhân quả — cần thận trọng khi trình cơ quan quản lý.
project:
  prompt: |
    **Mini project — Cây dự đoán churn có thể giải thích.** Đọc `customer_churn.csv` (`repo_path("data", "sample", "customer_churn.csv")`),
    bỏ `customer_id`, one-hot cột phân loại. Chia train/test 75/25 (`random_state=0`, `stratify`). Chọn `max_depth` (≤ 6) và
    `min_samples_leaf` bằng `GridSearchCV` (5-fold, `roc_auc`). Yêu cầu: **ROC-AUC test ≥ 0.78** (biến `test_auc`) và cây có **≤ 40 lá** (biến `n_leaves`).
  code: |
    import pandas as pd
    from sklearn.metrics import roc_auc_score
    from sklearn.model_selection import GridSearchCV, train_test_split
    from sklearn.tree import DecisionTreeClassifier
    from ml_course.utils import repo_path

    df = pd.read_csv(repo_path("data", "sample", "customer_churn.csv"))
    ### START CODE HERE ### (≈ 8 dòng)
    X = pd.get_dummies(df.drop(columns=["customer_id", "churn"]), dtype=float)
    y = df["churn"]
    X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, random_state=0, stratify=y)
    grid = GridSearchCV(DecisionTreeClassifier(random_state=0),
                        {"max_depth": [3, 4, 5, 6], "min_samples_leaf": [20, 50, 100]}, cv=5, scoring="roc_auc").fit(X_tr, y_tr)
    best = grid.best_estimator_
    test_auc = roc_auc_score(y_te, best.predict_proba(X_te)[:, 1])
    n_leaves = best.get_n_leaves()
    ### END CODE HERE ###
    print(grid.best_params_, "| ROC-AUC test:", round(test_auc, 4), "| số lá:", n_leaves)
  tests: |
    check_greater(test_auc, 0.78, "ROC-AUC test ≥ 0.78")
    check_less(n_leaves, 41, "≤ 40 lá")
