        question: "Feature 'trung bình chi tiêu của khách hàng' phải được tính từ:"
        options: {a: "Toàn bộ dữ liệu", b: "Chỉ các giao dịch trước thời điểm dự đoán", c: "Tập test", d: "Giao dịch hiện tại"}
        answer: b
