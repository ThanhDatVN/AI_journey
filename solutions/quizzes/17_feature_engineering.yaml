        lesson: 03_interaction_datetime_text_aggregation.ipynb
        type: mcq
        question: "Trong TF-IDF, từ xuất hiện trong hầu hết văn bản có trọng số:"
        options: {a: "Cao", b: "Thấp (IDF nhỏ)", c: "Bằng 1", d: "Âm"}
