title: "14 · Model Evaluation"
sections:
  theory:
    questions:
      - id: t01
        topic: accuracy paradox
        lesson: 01_confusion_matrix_and_metrics.ipynb
        type: mcq
        question: "Dữ liệu có 1% positive. Model luôn đoán negative đạt accuracy:"
        options: {a: "50%", b: "1%", c: "99%", d: "0%"}
        answer: c
        explanation: "Accuracy bị lớp đa số chi phối."
      - id: t02
        topic: precision vs recall
        lesson: 01_confusion_matrix_and_metrics.ipynb
        type: mcq
        question: "'Trong các email model đánh dấu spam, bao nhiêu % thật là spam?' là metric:"
        options: {a: "Recall", b: "Precision", c: "Specificity", d: "Accuracy"}
        answer: b
        explanation: "TP/(TP + FP)."
      - id: t03
        topic: F-beta
        lesson: 01_confusion_matrix_and_metrics.ipynb
        type: mcq
        question: "Sàng lọc bệnh: bỏ sót rất nguy hiểm. Nên dùng:"
        options: {a: "F0.5", b: "F2 (β > 1)", c: "Precision", d: "Accuracy"}
        answer: b
        explanation: "β > 1 ưu tiên recall."
      - id: t04
        topic: averaging
        lesson: 01_confusion_matrix_and_metrics.ipynb
        type: mcq
        question: "Bài toán nhiều lớp, lớp hiếm quan trọng như lớp phổ biến. Dùng:"
        options: {a: "Micro-F1", b: "Weighted-F1", c: "Macro-F1", d: "Accuracy"}
        answer: c
        explanation: "Macro: mỗi lớp như nhau."
      - id: t05
        topic: micro = accuracy
        lesson: 01_confusion_matrix_and_metrics.ipynb
        type: tf
        question: "Với bài toán đa lớp single-label, micro-F1 bằng accuracy."
        answer: true
        explanation: "Tổng FP = tổng FN."
      - id: t06
        topic: AUC meaning
        lesson: 02_roc_pr_and_thresholds.ipynb
        type: mcq
        question: "ROC-AUC = 0.8 nghĩa là:"
        options:
          a: "80% dự đoán đúng"
          b: "Chọn ngẫu nhiên một positive và một negative, 80% khả năng positive có điểm cao hơn"
          c: "Precision = 0.8"
          d: "Ngưỡng tối ưu = 0.8"
        answer: b
        explanation: "Mann–Whitney."
      - id: t07
        topic: AUC invariance
        lesson: 02_roc_pr_and_thresholds.ipynb
        type: tf
        question: "Lấy căn bậc ba mọi điểm số (biến đổi đơn điệu tăng) làm thay đổi ROC-AUC."
        answer: false
        explanation: "AUC chỉ phụ thuộc thứ tự."
      - id: t08
        topic: PR vs ROC
        lesson: 02_roc_pr_and_thresholds.ipynb
        type: mcq
        question: "Khi tỉ lệ positive giảm (cùng model), điều gì thường xảy ra?"
        options: {a: "ROC-AUC giảm mạnh, PR-AUC không đổi", b: "ROC-AUC gần như không đổi, PR-AUC giảm mạnh", c: "Cả hai không đổi", d: "Cả hai tăng"}
        answer: b
        explanation: "Precision phụ thuộc tỉ lệ lớp."
      - id: t09
        topic: PR baseline
        lesson: 02_roc_pr_and_thresholds.ipynb
        type: mcq
        question: "PR-AUC (average precision) của model ngẫu nhiên xấp xỉ:"
        options: {a: "0.5", b: "Tỉ lệ positive", c: "0", d: "1"}
        answer: b
        explanation: "Precision ngẫu nhiên = tỉ lệ positive."
      - id: t10
        topic: threshold
        lesson: 02_roc_pr_and_thresholds.ipynb
        type: multi
        question: "Cách chọn ngưỡng hợp lý trong thực tế?"
        options:
          a: "Tối thiểu chi phí FP/FN trên validation"
          b: "Thoả ràng buộc nghiệp vụ (recall ≥ X%, tối đa k cảnh báo)"
          c: "Luôn dùng 0.5"
          d: "Chọn trên tập test để có kết quả tốt nhất"
        answer: ab
        explanation: "Chọn trên test là leakage."
      - id: t11
        topic: probability metrics
        lesson: 02_roc_pr_and_thresholds.ipynb
        type: mcq
        question: "Hai model có cùng ROC-AUC. Muốn biết xác suất model nào đáng tin hơn, dùng:"
        options: {a: "Accuracy", b: "Log-loss / Brier score", c: "Recall", d: "ROC-AUC"}
        answer: b
        explanation: "AUC không đánh giá giá trị xác suất."
      - id: t12
        topic: MAE vs MSE
        lesson: 03_regression_metrics.ipynb
        type: mcq
        question: "Dự đoán hằng số tối ưu cho MAE là:"
        options: {a: "Trung bình", b: "Trung vị", c: "Mode", d: "Max"}
        answer: b
        explanation: "MSE ↔ trung bình; MAE ↔ trung vị; pinball ↔ phân vị."
      - id: t13
        topic: MAPE
        lesson: 03_regression_metrics.ipynb
        type: mcq
        question: "Vì sao MAPE không phù hợp cho doanh số ngày của sản phẩm bán chậm?"
        options: {a: "Tính quá chậm", b: "Chia cho y gần 0 → bùng nổ", c: "Không có đơn vị", d: "Luôn bằng 0"}
        answer: b
        explanation: "Dùng WAPE/MAE."
      - id: t14
        topic: R2
        lesson: 03_regression_metrics.ipynb
        type: multi
        question: "Phát biểu đúng về R²:"
        options:
          a: "Có thể âm"
          b: "Phụ thuộc phương sai của y trong tập đánh giá"
          c: "Luôn nằm trong [0, 1]"
          d: "R² = 0 tương đương dự đoán bằng trung bình"
        answer: abd
        explanation: "Không so sánh R² giữa các tập dữ liệu khác nhau."
      - id: t15
        topic: precision@k
        lesson: 04_choosing_metrics_case_studies.ipynb
        type: mcq
        question: "Đội kiểm tra chỉ xử lý được 200 cảnh báo/ngày. Metric phù hợp nhất:"
        options: {a: "Accuracy", b: "Precision@200 / Recall@200", c: "R²", d: "Micro-F1"}
        answer: b
        explanation: "Khớp với năng lực vận hành."
      - id: t16
        topic: paired comparison
        lesson: 04_choosing_metrics_case_studies.ipynb
        type: mcq
        question: "So sánh hai model trên cùng tập test, cách đúng là:"
        options:
          a: "Xem hai khoảng tin cậy riêng có chồng nhau không"
          b: "Bootstrap hiệu metric trên cùng các mẫu (paired) hoặc McNemar"
          c: "Chọn model có số lớn hơn"
          d: "Chạy lại trên tập test cho đến khi khác biệt rõ"
        answer: b
        explanation: "Hai model tương quan vì cùng dữ liệu."
  math:
    questions:
      - id: m01
        topic: precision
        lesson: 01_confusion_matrix_and_metrics.ipynb
        type: numeric
        decimals: 3
        question: "TP = 30, FP = 20, FN = 10. Precision = ?"
